  /* ===================== события ===================== */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-lang],[data-open],[data-close],[data-reply],[data-quick],[data-rate],[data-hide],#open-form,#f-send,#f-cancel,#reply-send,#reply-cancel,#a-save,#l-in,#l-out,#btn-read,#btn-dl,#btn-dl2,#btn-write-top,#btn-write2,#head-write,#annot-more");
    if (!el) return;

    if (el.dataset.lang) {
      S.lang = el.dataset.lang;
      try { localStorage.setItem("book-reviews-lang", S.lang); } catch (x) {}
      return render();
    }
    if (el.id === "open-form") {
      S.form.open = !S.form.open; S.form.error = "";
      render();
      if (S.form.open) { var f = document.getElementById("f-name"); if (f) f.focus(); }
      return;
    }
    if (el.dataset.open) { S.open[el.dataset.open] = true; return render(); }
    if (el.dataset.close) { delete S.open[el.dataset.close]; S.replyTo = null; return render(); }
    if (el.dataset.reply !== undefined && el.dataset.parent !== undefined) {
      captureDraft();
      S.replyTo = { reviewId: el.dataset.reply, parentId: el.dataset.parent };
      return render();
    }
    if (el.dataset.quick) {
      var box = document.getElementById("reply-text");
      if (box) { box.value = (box.value ? box.value.replace(/\s*$/, " ") : "") + el.dataset.quick + ". "; box.focus(); }
      return;
    }
    if (el.dataset.rate) { captureForm(); S.form.rating = +el.dataset.rate; S.form.error = ""; return render(); }
    if (el.id === "f-cancel") { S.form = { open: false, name: "", city: "", rating: 0, text: "", error: "" }; return render(); }
    if (el.id === "f-send") return submitReview();
    if (el.id === "reply-cancel") { S.replyTo = null; S.draft = { name: "", text: "" }; return render(); }
    if (el.id === "reply-send") return submitComment();
    if (el.dataset.hide) return toggleHide(el.dataset.hide);
    if (el.id === "a-save") return saveSettings();
    if (el.id === "annot-more") { S.annotOpen = !S.annotOpen; return render(); }
    if (el.id === "btn-read") {
      S.readerOpen = !S.readerOpen;
      if (S.readerOpen) onceADay("read", function () { bumpStat("reads"); });
      render();
      if (S.readerOpen) {
        var sec = document.querySelector("#reader-slot .reader");
        if (sec) sec.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      return;
    }
    if (el.id === "btn-dl" || el.id === "btn-dl2") {
      bumpStat("downloads");
      if (S.lang === "kk") bumpStat("downloadsKk");
      return; // ссылку не перехватываем, браузер скачает сам
    }
    if (el.id === "btn-write-top" || el.id === "btn-write2" || el.id === "head-write") {
      S.form.open = true; S.form.error = "";
      render();
      var f = document.getElementById("f-name");
      if (f) { f.focus(); f.scrollIntoView({ behavior: "smooth", block: "center" }); }
      return;
    }
    if (el.id === "l-in") return signIn();
    if (el.id === "l-out") return firebase.auth().signOut();
  });

  function captureForm() {
    var n = document.getElementById("f-name"), c = document.getElementById("f-city"), x = document.getElementById("f-text");
    if (n) S.form.name = n.value;
    if (c) S.form.city = c.value;
    if (x) S.form.text = x.value;
  }
  function captureDraft() {
    var n = document.getElementById("reply-name"), x = document.getElementById("reply-text");
    if (n) S.draft.name = n.value;
    if (x) S.draft.text = x.value;
  }

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function dayKeyOffset(back) {
    var d = new Date();
    d.setDate(d.getDate() - back);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function bumpStat(field) {
    try {
      if (!S.db || typeof firebase === "undefined") return;
      var key = todayKey();
      var inc = firebase.firestore.FieldValue.increment(1);
      var patch = { day: key }; patch[field] = inc;
      S.db.doc("stats/" + key).set(patch, { merge: true }).catch(function () {});
      var tp = { day: "total" }; tp[field] = inc;
      S.db.doc("stats/total").set(tp, { merge: true }).catch(function () {});
    } catch (e) {}
  }

  function onceADay(flag, fn) {
    var k = "bk-" + flag + "-" + todayKey();
    try {
      if (localStorage.getItem(k)) return;
      localStorage.setItem(k, "1");
    } catch (e) {}
    fn();
  }

  /* текст в абзацы: пустая строка разделяет, строка с ## - заголовок */
  function bookText(raw) {
    var blocks = String(raw || "").replace(/\r/g, "").split(/\n\s*\n/);
    var out = "", first = true;
    blocks.forEach(function (b) {
      b = b.trim();
      if (!b) return;
      if (b.indexOf("##") === 0) {
        out += "<h3>" + esc(b.replace(/^#+\s*/, "")) + "</h3>";
        first = true;
      } else {
        out += '<p' + (first ? ' class="first"' : "") + ">" + esc(b).replace(/\n/g, "<br>") + "</p>";
        first = false;
      }
    });
    return out;
  }

  function newId() {
    return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  }

  function submitReview() {
    captureForm();
    var L = t(), F = S.form;
    if (!F.name.trim()) { F.error = L.needName; return render(); }
    if (!F.rating) { F.error = L.needRating; return render(); }
    if (F.text.trim().length < 3) { F.error = L.needText; return render(); }
    if (!S.db) { F.error = L.offline; return render(); }

    var doc = {
      name: F.name.trim().slice(0, 60),
      city: F.city.trim().slice(0, 40),
      rating: F.rating,
      text: F.text.trim().slice(0, 4000),
      createdAt: new Date().toISOString(),
      lang: S.lang
    };
    var id = newId();
    S.form = { open: false, name: "", city: "", rating: 0, text: "", error: "" };
    render();
    S.db.doc("reviews/" + id).set(doc).then(function () {
      S.open[id] = true;
      toast(L.thanks);
      render();
      notifyEmail({
        kind: "Новый отзыв о книге",
        name: doc.name,
        city: doc.city || "не указан",
        rating: doc.rating + " из 5",
        text: doc.text
      });
    }).catch(function (err) {
      S.form.open = true;
      S.form.name = doc.name; S.form.city = doc.city; S.form.rating = doc.rating; S.form.text = doc.text;
      S.form.error = err && err.code === "quota_exceeded" ? "Хранилище заполнено" : L.offline;
      render();
    });
  }

  function submitComment() {
    captureDraft();
    var L = t();
    if (!S.replyTo || !S.db) return;
    if (!S.draft.name.trim() || S.draft.text.trim().length < 2) {
      toast(!S.draft.name.trim() ? L.needName : L.needText);
      return;
    }
    var payload = {
      reviewId: S.replyTo.reviewId,
      parentId: S.replyTo.parentId || "",
      name: S.draft.name.trim().slice(0, 60),
      text: S.draft.text.trim().slice(0, 2000),
      createdAt: new Date().toISOString()
    };
    S.replyTo = null;
    S.draft = { name: payload.name, text: "" };
    render();
    S.db.doc("comments/" + newId()).set(payload).then(function () {
      toast(L.thanksReply);
      notifyEmail({
        kind: "Новый ответ в обсуждении",
        name: payload.name,
        city: "-",
        rating: "-",
        text: payload.text
      });
    }).catch(function () { toast(t().offline); });
  }

  function toggleHide(id) {
    if (!S.db) return;
    var cur = S.moderation[id] && S.moderation[id].hidden;
    S.db.doc("moderation/" + id).set({ hidden: !cur, at: new Date().toISOString() })
      .catch(function () { toast(t().noAccess); });
  }

  function signIn() {
    var L = t();
    var mail = (document.getElementById("l-mail") || {}).value || "";
    var pass = (document.getElementById("l-pass") || {}).value || "";
    if (!mail || !pass) { toast(L.loginHint); return; }
    firebase.auth().signInWithEmailAndPassword(mail.trim(), pass)
      .catch(function () { toast(L.loginFailed); });
  }

  function saveSettings() {
    if (!S.db) return;
    var L = t();
    var st = {
      title: (document.getElementById("a-title") || {}).value || "",
      author: (document.getElementById("a-author") || {}).value || "",
      lede: (document.getElementById("a-lede") || {}).value || "",
      annot: (document.getElementById("a-annot") || {}).value || "",
      preview: (document.getElementById("a-preview") || {}).value || "",
      pdf: (document.getElementById("a-pdf") || {}).value || "",
      cover: (document.getElementById("a-cover") || {}).value || "",
      coverKk: (document.getElementById("a-coverKk") || {}).value || "",
      counterMin: parseInt((document.getElementById("a-cmin") || {}).value, 10) || 0,
      titleKk: (document.getElementById("a-titleKk") || {}).value || "",
      ledeKk: (document.getElementById("a-ledeKk") || {}).value || "",
      annotKk: (document.getElementById("a-annotKk") || {}).value || "",
      previewKk: (document.getElementById("a-previewKk") || {}).value || "",
      pdfKk: (document.getElementById("a-pdfKk") || {}).value || ""
    };
    S.settings = st;
    render();
    S.db.doc("settings/site").set(st).then(function () { toast(L.saved); })
      .catch(function () { toast(L.noAccess); });
  }

  /* логотип в шапке: показываем, только если файл есть */
  (function () {
    var box = document.getElementById("brand-logo"), sep = document.getElementById("brand-sep");
    if (!box) return;
    var light = box.querySelector(".lg-light");
    if (!light) return;
    function show() { box.hidden = false; if (sep) sep.hidden = false; }
    function hide() { box.hidden = true; if (sep) sep.hidden = true; }
    if (light.complete) { (light.naturalWidth ? show : hide)(); }
    light.addEventListener("load", show);
    light.addEventListener("error", hide);
  })();

  /* если дописать #admin или #otzyv к открытой странице - переключаемся без перезагрузки */
  window.addEventListener("hashchange", function () {
    var wasAdmin = S.admin;
    S.admin = /(^|[#&])admin\b/.test(location.hash);
    S.mode = /(^|[#&])otzyv\b/.test(location.hash) ? "review" : "book";
    if (S.admin && !wasAdmin && S.authed && S.db && !S.statsOn) subscribeStats(S.db);
    render();
  });

  var rzT;
  window.addEventListener("resize", function () {
    clearTimeout(rzT);
    rzT = setTimeout(render, 180);
  });

  /* ===================== старт ===================== */
  render();

  // ---- Firebase ----
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyDKGmPM1i7tAo0E_6QRIytnRp14uL-8WZ4",
    authDomain: "kniga-otzyvy.firebaseapp.com",
    projectId: "kniga-otzyvy",
    storageBucket: "kniga-otzyvy.firebasestorage.app",
    messagingSenderId: "67182678369",
    appId: "1:67182678369:web:08b0d02429d89c19603520"
  };

  function startFirebase() {
    if (typeof firebase === "undefined") {
      render();
      return;
    }
    firebase.initializeApp(FIREBASE_CONFIG);
    var db = firebase.firestore();
    S.db = db;

    firebase.auth().onAuthStateChanged(function (user) {
      S.authed = !!user;
      if (user && S.admin && !S.statsOn) subscribeStats(db);
      render();
    });

    // считаем посещение: один раз в день с одного браузера
    onceADay("visit", function () { bumpStat("visits"); });

    db.collection("reviews").orderBy("createdAt", "desc").limit(300).onSnapshot(function (snap) {
      S.reviews = snap.docs.map(function (d) {
        var v = d.data() || {};
        return {
          id: d.id, name: v.name || "", city: v.city || "",
          rating: Math.max(1, Math.min(5, parseInt(v.rating, 10) || 5)),
          text: v.text || "", createdAt: v.createdAt || ""
        };
      });
      render();
    }, function () { render(); });

    db.collection("comments").orderBy("createdAt", "asc").limit(1000).onSnapshot(function (snap) {
      S.comments = snap.docs.map(function (d) {
        var v = d.data() || {};
        return {
          id: d.id, reviewId: v.reviewId || "", parentId: v.parentId || "",
          name: v.name || "", text: v.text || "", createdAt: v.createdAt || ""
        };
      });
      render();
    }, function () {});

    db.collection("moderation").limit(500).onSnapshot(function (snap) {
      var m = {};
      snap.docs.forEach(function (d) { m[d.id] = d.data() || {}; });
      S.moderation = m;
      render();
    }, function () {});

    db.doc("stats/total").onSnapshot(function (d) {
      S.total = d.exists ? (d.data() || {}) : {};
      render();
    }, function () {});

    db.doc("settings/site").onSnapshot(function (d) {
      var v = d.exists ? (d.data() || {}) : {};
      S.settings = {
        title: v.title || DEFAULT_TITLE,
        titleKk: v.titleKk || DEFAULT_TITLE_KK,
        author: v.author || "",
        lede: v.lede || "",
        ledeKk: v.ledeKk || "",
        annot: v.annot || DEFAULT_ANNOT_RU,
        annotKk: v.annotKk || DEFAULT_ANNOT_KK,
        preview: v.preview || PREVIEW_RU,
        previewKk: v.previewKk || PREVIEW_KK,
        pdf: v.pdf === undefined ? "book.pdf" : v.pdf,
        pdfKk: v.pdfKk === undefined ? "book-kk.pdf" : v.pdfKk,
        cover: v.cover ? v.cover : COVER_RU,
        coverKk: v.coverKk ? v.coverKk : COVER_KK,
        counterMin: v.counterMin === undefined ? 30 : (parseInt(v.counterMin, 10) || 0)
      };
      render();
    }, function () {});
  }

  function subscribeStats(db) {
    S.statsOn = true;
    db.collection("stats").orderBy("day", "desc").limit(400).onSnapshot(function (snap) {
      var m = {};
      snap.docs.forEach(function (d) { if (d.id !== "total") m[d.id] = d.data() || {}; });
      S.stats = m;
      render();
    }, function () {});
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startFirebase);
  } else {
    startFirebase();
  }
})();
</script>
</body>
</html>
