<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Отзывы читателей книги «Завтра начинается сегодня»">
<meta name="color-scheme" content="light dark">
<title>Голоса читателей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<style>
  :root {
    --bg: #FAF6EE;
    --bg-tint: #F2EADC;
    --surface: #FFFFFF;
    --surface-2: #F6F1E7;
    --line: #E3D9C6;
    --ink: #10333C;
    --ink-2: #2F5661;
    --muted: #78898F;
    --accent: #11889E;
    --accent-soft: #DCEFF4;
    --accent-ink: #0B6477;
    --honey: #C09124;
    --honey-soft: #F6EBCF;
    --shadow: 0 1px 2px rgba(16,51,60,.05), 0 10px 28px -14px rgba(16,51,60,.22);
    --on-accent: #FFFFFF;
    --danger: #A8402A;
    --radius: 14px;
    --maxw: 1140px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1A1F;
      --bg-tint: #102329;
      --surface: #13272D;
      --surface-2: #18323A;
      --line: #27454D;
      --ink: #E9F3F5;
      --ink-2: #C4D9DE;
      --muted: #8CA4AB;
      --accent: #3FBBD4;
      --accent-soft: #123038;
      --accent-ink: #86DBEC;
      --honey: #DEBC53;
      --honey-soft: #332C14;
      --on-accent: #06232B;
      --danger: #F0967C;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 28px -14px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1A1F;
    --bg-tint: #102329;
    --surface: #13272D;
    --surface-2: #18323A;
    --line: #27454D;
    --ink: #E9F3F5;
    --ink-2: #C4D9DE;
    --muted: #8CA4AB;
    --accent: #3FBBD4;
    --accent-soft: #123038;
    --accent-ink: #86DBEC;
    --honey: #DEBC53;
    --honey-soft: #332C14;
    --on-accent: #06232B;
    --danger: #F0967C;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 28px -14px rgba(0,0,0,.65);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Golos Text", "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 20px; }

  /* ---------- header ---------- */
  header.top {
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, var(--bg-tint) 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--line);
  }
  .backdrop {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; opacity: .85;
  }
  :root[data-theme="dark"] .backdrop { opacity: .5; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .backdrop { opacity: .5; } }
  header.top > .wrap { position: relative; z-index: 1; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding-block: 14px;
  }
  .brandmark {
    display: flex; align-items: center; gap: 9px;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
  }
  .brandmark svg { display: block; }
  .brandlogo { display: inline-flex; align-items: center; }
  .brandlogo img { display: block; height: 24px; width: auto; max-width: 160px; }
  .brandlogo .lg-dark { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .brandlogo .lg-light { display: none; }
    :root:not([data-theme="light"]) .brandlogo .lg-dark { display: block; }
  }
  :root[data-theme="dark"] .brandlogo .lg-light { display: none; }
  :root[data-theme="dark"] .brandlogo .lg-dark { display: block; }
  .brandsep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
  .langs { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .langs button {
    font: inherit; font-size: 13px; font-weight: 600; letter-spacing: .02em;
    border: 0; background: transparent; color: var(--muted);
    padding: 5px 12px; border-radius: 999px; cursor: pointer;
  }
  .langs button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); }

  .hero { padding-block: 26px 34px; display: grid; gap: 28px; grid-template-columns: minmax(0,1.15fr) minmax(0,1fr); align-items: center; }
  @media (max-width: 760px) { .hero { grid-template-columns: 1fr; align-items: start; gap: 22px; padding-block: 18px 28px; } }
  .eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent-ink); font-weight: 600; margin: 0 0 10px; }
  h1 {
    font-family: Literata, Georgia, "Times New Roman", serif;
    font-weight: 600; font-size: clamp(30px, 5.2vw, 50px); line-height: 1.08;
    margin: 0 0 12px; text-wrap: balance; letter-spacing: -.015em;
  }
  h1 .draft-title { color: var(--muted); font-style: italic; }
  .lede { margin: 0; color: var(--ink-2); font-size: 17px; max-width: 54ch; }
  .byline { margin: 10px 0 0; color: var(--muted); font-size: 14px; }

  .hero-media { display: grid; gap: 16px; justify-items: center; align-content: start; }
  .hero-media img {
    display: block; width: 100%; max-width: 500px; height: auto;
    filter: drop-shadow(0 18px 34px rgba(31,47,31,.22));
  }
  :root[data-theme="dark"] .hero-media img { filter: drop-shadow(0 18px 34px rgba(0,0,0,.6)); }
  .hero-media .scorecard { width: 100%; }
  @media (max-width: 760px) {
    .hero-media { order: -1; }
    .hero-media img { max-width: 330px; }
  }

  .scorecard {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px 20px; box-shadow: var(--shadow); display: grid; gap: 14px;
  }
  .score-row { display: flex; align-items: baseline; gap: 12px; }
  .score-num {
    font-family: Literata, Georgia, serif; font-size: 42px; line-height: 1;
    font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .score-meta { font-size: 13.5px; color: var(--muted); }
  .bars { display: grid; gap: 5px; }
  .bar { display: grid; grid-template-columns: 34px 1fr 30px; align-items: center; gap: 9px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar .track { height: 7px; border-radius: 99px; background: var(--bg-tint); overflow: hidden; }
  .bar .fill { height: 100%; background: var(--honey); border-radius: 99px; transition: width .5s ease; }

  .stars { display: inline-flex; gap: 2px; line-height: 0; }
  .stars svg { width: 15px; height: 15px; display: block; }
  .star-on { fill: var(--honey); }
  .star-off { fill: none; stroke: var(--line); stroke-width: 1.6; }

  /* ---------- write bar ---------- */
  .writebar { padding-block: 0 4px; }
  .cta {
    font: inherit; font-weight: 600; font-size: 16px;
    background: var(--accent); color: var(--on-accent); border: 0; border-radius: 999px;
    padding: 13px 26px; cursor: pointer; box-shadow: var(--shadow);
    transition: transform .15s ease, filter .15s ease;
  }
  .cta:hover { filter: brightness(1.05); transform: translateY(-1px); }
  .cta:active { transform: translateY(0); }
  .cta.ghost { background: transparent; color: var(--accent-ink); border: 1px solid var(--line); box-shadow: none; }
  .cta.small { font-size: 14px; padding: 9px 16px; }
  a.cta { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }

  /* ---------- form ---------- */
  .form-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 22px; margin-block: 18px 6px;
  }
  .form-card h2 { font-family: Literata, Georgia, serif; font-size: 22px; margin: 0 0 4px; font-weight: 600; }
  .form-hint { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .fields { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 620px) { .fields { grid-template-columns: 1fr; } }
  .field { display: grid; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  label { font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: .01em; }
  label .opt { font-weight: 400; color: var(--muted); }
  input[type="text"], input[type="password"], textarea {
    font: inherit; color: var(--ink); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; width: 100%;
    resize: vertical;
  }
  input[type="text"]:focus-visible, input[type="password"]:focus-visible, textarea:focus-visible, button:focus-visible, .cell:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  textarea { min-height: 120px; line-height: 1.55; }
  .starpick { display: flex; gap: 4px; align-items: center; }
  .starpick button { background: none; border: 0; padding: 3px; cursor: pointer; line-height: 0; }
  .starpick svg { width: 27px; height: 27px; }
  .starpick .label { margin-left: 8px; font-size: 13.5px; color: var(--muted); }
  .form-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 18px; }
  .err { color: var(--danger); font-size: 13.5px; }

  /* ---------- grid of cells ---------- */
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 14px;
    flex-wrap: wrap; margin: 34px 0 14px;
  }
  .section-head h2 { font-family: Literata, Georgia, serif; font-size: 25px; margin: 0; font-weight: 600; }
  .count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .section-head .spacer { flex: 1; }

  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); align-items: start; }
  .cell {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 17px; cursor: pointer; text-align: left; font: inherit; color: inherit;
    display: grid; gap: 9px; width: 100%; transition: border-color .18s ease, transform .18s ease;
  }
  .cell:hover { border-color: var(--accent); transform: translateY(-1px); }
  .cell.open { grid-column: 1 / -1; cursor: default; box-shadow: var(--shadow); border-color: var(--accent); }
  .cell.example { border-style: dashed; background: transparent; cursor: default; }
  .cell-head { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-weight: 600; font-size: 14px;
    background: var(--accent-soft); color: var(--accent-ink);
  }
  .who { display: grid; gap: 1px; min-width: 0; }
  .who .nm { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .mt { font-size: 12.5px; color: var(--muted); }
  .cell-head .stars { margin-left: auto; flex: none; }
  .snippet {
    margin: 0; color: var(--ink-2); font-size: 15px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .cell-foot { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .chip-count {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 10px; font-size: 12.5px;
  }
  .more { margin-left: auto; color: var(--accent-ink); font-weight: 600; font-size: 13px; }
  .badge-example {
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600;
    color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px;
  }

  .full-text { margin: 0; font-size: 16.5px; line-height: 1.65; color: var(--ink); white-space: pre-wrap; }
  .full-text + .thread { margin-top: 6px; }

  /* ---------- thread ---------- */
  .thread { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 12px; }
  .thread-title { font-size: 12px; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0; }
  .node { display: grid; gap: 7px; }
  .node .body {
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 11px 13px; display: grid; gap: 5px;
  }
  .node .meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .node .meta b { color: var(--ink); font-size: 13.5px; font-weight: 600; }
  .node p { margin: 0; font-size: 15px; white-space: pre-wrap; }
  .kids { display: grid; gap: 12px; margin-left: 16px; padding-left: 14px; border-left: 2px solid var(--line); }
  .replybtn { background: none; border: 0; padding: 0; font: inherit; font-size: 13px; font-weight: 600; color: var(--accent-ink); cursor: pointer; justify-self: start; }
  .replybox { background: var(--surface-2); border: 1px solid var(--accent); border-radius: 12px; padding: 12px; display: grid; gap: 9px; }
  .quick { display: flex; gap: 7px; flex-wrap: wrap; }
  .quick button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 12px; color: var(--ink-2);
  }
  .quick button:hover { border-color: var(--accent); color: var(--accent-ink); }
  .replybox .row { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
  .replybox input[type="text"] { max-width: 220px; }

  /* ---------- states ---------- */
  .empty {
    border: 1px dashed var(--line); border-radius: var(--radius); padding: 26px;
    text-align: center; color: var(--muted); grid-column: 1 / -1;
  }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    background: var(--accent); color: var(--on-accent); padding: 12px 20px; border-radius: 999px;
    font-weight: 600; font-size: 15px; box-shadow: var(--shadow); z-index: 50;
  }
  .notice {
    background: var(--honey-soft); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 13px 16px; font-size: 14px; color: var(--ink-2); margin-block: 16px;
  }

  /* ---------- admin ---------- */
  .admin {
    background: var(--surface); border: 1px dashed var(--accent); border-radius: var(--radius);
    padding: 18px; margin-block: 18px; display: grid; gap: 12px;
  }
  .admin h2 { margin: 0; font-size: 17px; font-family: Literata, Georgia, serif; font-weight: 600; }
  .admin .fields { grid-template-columns: 1fr 1fr; }
  .langhead {
    margin: 6px 0 0; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    font-weight: 600; color: var(--accent-ink);
  }
  .hide-btn { background: none; border: 0; font: inherit; font-size: 12.5px; color: var(--muted); cursor: pointer; text-decoration: underline; padding: 0; }
  .cell.hidden-rev { opacity: .5; }

  footer.foot { border-top: 1px solid var(--line); margin-top: 44px; padding-block: 24px 40px; color: var(--muted); font-size: 13.5px; }
  footer.foot a { color: var(--accent-ink); }

  /* ---------- книга: кнопки, аннотация, читалка ---------- */
  .herobtns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
  .dlcount {
    margin: 12px 0 0; font-size: 13.5px; color: var(--muted);
    display: flex; align-items: center; gap: 7px;
  }
  .dlcount b { color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }
  .dlcount svg { width: 15px; height: 15px; flex: none; }
  .annot { margin: 14px 0 0; color: var(--ink-2); font-size: 16.5px; max-width: 58ch; }
  .annot p { margin: 0 0 10px; }
  .annot p:last-child { margin-bottom: 0; }
  .annot-more {
    background: none; border: 0; padding: 0; margin-top: 8px; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 600; color: var(--accent-ink);
  }
  .annot-more:hover { text-decoration: underline; }

  .reader {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 30px 28px; margin-block: 22px 6px;
  }
  @media (max-width: 620px) { .reader { padding: 22px 18px; } }
  .reader-inner { max-width: 62ch; margin: 0 auto; }
  .reader h2 {
    font-family: Literata, Georgia, serif; font-size: 13px; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    margin: 0 0 20px; text-align: center;
  }
  .reader .bodytext { font-family: Literata, Georgia, serif; font-size: 18px; line-height: 1.72; color: var(--ink); }
  .reader .bodytext p { margin: 0 0 1.1em; text-indent: 1.4em; }
  .reader .bodytext p.first { text-indent: 0; }
  .reader .bodytext h3 {
    font-family: Literata, Georgia, serif; font-size: 22px; font-weight: 600;
    margin: 1.8em 0 .8em; text-align: center; text-wrap: balance;
  }
  .reader .bodytext h3:first-child { margin-top: 0; }
  .reader-end {
    margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--line);
    display: grid; gap: 14px; justify-items: center; text-align: center;
  }
  .reader-end p { margin: 0; font-family: Literata, Georgia, serif; font-size: 19px; color: var(--ink); max-width: 36ch; }
  .reader-end .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  /* ---------- статистика ---------- */
  .statgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
  .stat {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    display: grid; gap: 2px;
  }
  .stat .n { font-family: Literata, Georgia, serif; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .spark { display: flex; align-items: flex-end; gap: 2px; height: 70px; margin-top: 4px; }
  .spark span {
    flex: 1; min-width: 2px; background: var(--accent); border-radius: 2px 2px 0 0;
    opacity: .75;
  }
  .spark span.zero { background: var(--line); opacity: 1; height: 2px !important; }
  .spark-legend { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 5px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>


<header class="top">
  <svg class="backdrop" viewBox="0 0 1200 560" preserveAspectRatio="xMaxYMid slice" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="silk1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#8FD9E6" stop-opacity=".55"></stop>
        <stop offset="55%" stop-color="#2AA3BC" stop-opacity=".30"></stop>
        <stop offset="100%" stop-color="#0C6477" stop-opacity=".10"></stop>
      </linearGradient>
      <linearGradient id="silk2" x1="1" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1A93AD" stop-opacity=".30"></stop>
        <stop offset="100%" stop-color="#BFE9F0" stop-opacity=".06"></stop>
      </linearGradient>
      <linearGradient id="cream" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".75"></stop>
        <stop offset="100%" stop-color="#F3E7CF" stop-opacity=".30"></stop>
      </linearGradient>
      <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#E0C275" stop-opacity="0"></stop>
        <stop offset="35%" stop-color="#C9A227" stop-opacity=".75"></stop>
        <stop offset="100%" stop-color="#E7D08A" stop-opacity="0"></stop>
      </linearGradient>
    </defs>
    <path d="M1200,0 C980,80 900,250 1010,400 C1080,495 1160,520 1200,540 Z" fill="url(#silk1)"></path>
    <path d="M1200,120 C1020,180 860,300 900,470 C930,560 1080,560 1200,560 Z" fill="url(#silk2)"></path>
    <path d="M620,560 C760,430 840,300 1030,230 C1120,196 1180,190 1200,186 L1200,560 Z" fill="url(#cream)"></path>
    <path d="M520,560 C700,470 790,330 980,270 C1090,236 1160,232 1200,228" fill="none" stroke="url(#gold)" stroke-width="1.4"></path>
    <path d="M700,560 C860,450 930,330 1110,282 C1160,268 1185,264 1200,262" fill="none" stroke="url(#gold)" stroke-width="1"></path>
  </svg>
  <div class="wrap">
    <div class="topbar">
      <div class="brandmark">
        <span class="brandlogo" id="brand-logo" hidden>
          <img class="lg-light" src="logo.svg" alt="bcc life">
          <img class="lg-dark" src="logo-white.svg" alt="bcc life">
        </span>
        <span class="brandsep" id="brand-sep" hidden></span>
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">

  var PREVIEW_RU = "## ПРОЛОГ\n\nПервое сентября, девять утра, школьный двор.\n\nДамиру семь лет, и он стоит в форме, которая ему велика. Динара специально взяла на размер больше, чтобы хватило на год. Рукава закрывают половину ладони, воротник торчит. Букет, что он держит в руках, больше его самого. Обхватив цветы, будто что-то тяжёлое и хрупкое одновременно, он очень старается их не уронить. Алихан снимает видео на телефон. Рядом Динара, и она тоже снимает. Они снимают одно и то же с расстояния в полметра, и оба это понимают, но никто не опускает руку.\n\nЧуть в стороне стоит Аяна. Как быстро летит время! Уже десятый класс… Ей исполнилось 16, она в наушниках. Вид у неё подчёркнуто скучающий, и по выражению лица дочери хорошо понятно, что она здесь только потому, что её заставили. Через год и для неё прозвенит последний звонок.\n\nОтец Алихана, Серик Кабдуллаевич, приехал с другого конца города на автобусе, хотя сын предлагал заехать. Ему шестьдесят восемь. Трость он носит больше для солидности, чем по необходимости: ходит он бодро, а трость, по его словам, помогает разговаривать с чиновниками. В кармане у него лежала конфета для внука. Она пролежала там всю линейку и растаяла.\n\nДиректор говорит в микрофон, издающий противный резкий шум. Аппаратура фонит. Никто не слушает.\n\nВскоре зашелестела обёрточная бумага, дети вручили благоухающие разноцветные охапки классной руководительнице и сфотографировались с ней у входа. Потом учеников увели, и родители остались во дворе, разговаривая ни о чём, оттягивая момент, когда надо ехать на работу.\n\nАлихан довёз отца до дома. По дороге они говорили о машине, о соседе, который наконец достроил гараж, и о том, что осень в этом году ранняя. Уже у подъезда отец, отстёгивая ремень, сказал между делом:\n\n– Пенсию вчера дали. На месяц хватит, если аккуратно.\n\nНадо сказать, что жалуется отец редко и неохотно. У него есть дача, где он третий год выводит помидоры, устойчивые к нашему июлю, и по этому поводу ведёт тетрадь с запис ую дочь. Сегодняшний Алихан справится. Но Дамира будет учить не сегодняшний Алихан…\n\nДамира будет учить какой-то другой человек. 53-летний. Алихан не знает о нём ничего. Он не знает, будет ли у того человека этот бизнес. Одиннадцать лет назад у него было одно дело, и той компании больше нет. Ничего страшного тогда не произошло, просто рынок поменялся. Сейчас он не знает, каким будет его здоровье. Отец в 53 года был здоров как бык, а в 61 слёг так, что полгода не вставал. Он не знает, что вообще будет через одиннадцать лет со страной, с курсом, с ценами на обучение.\n\nУ него не было сомнений в своём желании. Желание будет. Он сомневается в возможности. Это, если совсем честно, две очень разные вещи, которые взрослые мужчины постоянно путают.\n\nЕсть ещё одна деталь, о которой Алихан подумал уже в офисе, между двумя звонками – Марат.\n\nДальний родственник, старше на пять лет. В 2017 году Марат был человеком, на которого смотрели: две точки, машина, поездки. Потом не осталось ничего, и дело было не в глупости и не в лени, просто всё, что у него было, лежало в одном месте, и это место закрылось.\n\nМарат сейчас работает. Нормально работает, «поднимается» потихоньку. Но его старшая дочь ушла с третьего курса на заочное отделение и пошла работать, потому что платить стало нечем. Об этом в семье не говорят вслух.\n\nАлихан вспомнил это не потому, что боится повторить. А потому, что понял простую вещь: у Марата тоже было желание – не было возможности.\n\nВечером, когда Дамир уже спал, Алихан листал фотографии с линейки.\n\nНа одной из них они стояли втроём: дед, отец и сын. Три поколения в одном кадре… Алихан вдруг понял, что это не просто фотография. Он смотрит на цепочку.\n\nЕго отец сделал всё, что мог, и получил столько, что «на месяц хватит, если аккуратно». Не потому, что плохо работал. Система, в которой он работал, обещала одно, а получилось другое, и лично от отца это уже не зависело.\n\nОн, Алихан, работает в другой системе. Здесь никто ничего не обещает. Здесь всё зависит от него самого. Это звучит страшнее, но на самом деле это лучше, потому что если все зависит от тебя, то ты хотя бы можешь что-то сделать.\n\nВопрос только в том, что именно.\n\nОн открыл телефон и попробовал зайти в приложение ЕНПФ, где можно посмотреть свой пенсионный счет. Оказалось, что он не помнит пароль. Оказалось, что он вообще не помнит пароля даже от Egov mobile и забыл, когда заходил туда в последний раз.\n\n42 года. Двое детей. Своё дело. И он не знает, сколько у него на счёте.\n\nОн не стал восстанавливать пароль в одиннадцать вечера. Отложил телефон и лёг.\n\nНо 1 сентября 2037 года никуда не делось. Оно уже стояло в календаре. Ровно через 11 лет. В этот день тоже будет линейка, только выпускная, и на ней будет стоять Дамир, уже выше отца на полголовы, и рядом будет стоять 53-летний человек, которого Алихан пока не знает.\n\nЕму очень хотелось, чтобы этот человек был спокоен.\n\nС этого места начинается книга.\n\nВместе мы разберём, откуда вообще берётся пенсия в Казахстане и почему поколению Алихана не стоит рассчитывать на то же самое, на что рассчитывал его отец. Посчитаем, сколько у него будет и сколько ему нужно. Отдельно поговорим о тех, кто,\n\nкак и Алихан, работает на себя. Посмотрим, как эту задачу решают семьи в Нидерландах, Германии, Сингапуре и Японии.\n\nДалее мы рассмотрим по одному инструменту, которые для этой задачи существуют. Что делать, если в семье работает один? Как накопить на образование ребёнка к конкретному году, а не когда-нибудь? Что такое пенсионный аннуитет и почему он не то, чем кажется? Что делать, если у жены нет своих накоплений? Обязательно поговорим о том, о чём обычно молчат. Что, если компания закроется? А если всё «съест» инфляция? А может, лучше квартира? А если я захочу забрать деньги обратно? Начнём с самого начала: с того, как вообще устроена Ваша пенсия.\n\n## ЧАСТЬ ПЕРВАЯ. Где Вы сейчас\n\n## Глава 1. Как устроена пенсия в Казахстане и сколько Вам не хватает\n\nПароль Алихан восстановил в субботу утром.\n\nНе потому, что собрался. Просто Динара с детьми уехала к матери, дома стало тихо, и он вспомнил о телефоне, отложенном первого сентября. Три минуты – на СМС с кодом, ещё две – на новый пароль, который он тут же забыл.\n\nНаконец, он зашёл в личный кабинет.\n\nСверху – имя. Ниже – сумма накоплений. Ещё ниже – история взносов помесячно, за двадцать лет.\n\nАлихан смотрел на эти строчки дольше, чем нужно, чтобы их прочитать. Он не то чтобы расстроился. Он просто не понял, много это или мало. Итоговая цифра была семизначная, и на слух звучала прилично. Примерно, как хорошая машина.\n\nПотом он полистал историю.\n\nПервая часть – до 2014 года – выглядела нормально: суммы разные, растут от года к году: видно, как поднималась зарплата. А дальше, с того месяца, когда он ушёл в своё дело, начиналась ровная полоса. Одна и та же сумма, из месяца в месяц, двенадцать лет подряд. Как кардиограмма человека, которому уже не помочь. Он посмотрел на эту полосу и понял, что вообще-то это его собственное решение. Он его когда-то принял. Просто он не помнил, как принимал.\n\nОн попробовал вспомнить тот день. 2014 год. Кабинет, девушка с монитором, стопка бумаг, вопросы, на которые он отвечал не глядя, потому что торопился и потому что всё это казалось формальностью. Где-то там был вопрос о доходах, с которых будут считаться взносы. Он назвал минимальный. Не из жадности. Просто в тот момент у него не было вообще никакого дохода, был только страх, что через три месяца придётся возвращаться наёмным сотрудником на работу.\n\nЧерез три месяца возвращаться не пришлось. А строчка осталась. На двенадцать лет…\n\nЧтобы понять, много у Алихана денег или мало, надо сначала разобраться, откуда вообще берётся пенсия в Казахстане. Это займёт несколько страниц, но без этого дальше говорить не о чем.\n\nПенсия у нас складывается из трёх частей.\n\nБазовая пенсия. Её платит государство из бюджета всем, кто достиг пенсионного возраста. Размер базовой пенсии зависит только от того, сколько лет человек участвовал в пенсионной системе. Если стаж участия меньше десяти лет, базовая составляет 70 % прожиточного минимума. Затем она растёт каждый год, и при стаже свыше 34 лет достигает 118 %. В деньгах 2026 года это от 35 596 до 60 005 теңге.\n\nОбратите внимание: базовая пенсия не зависит от того, сколько человек зарабатывал. Директор завода и вахтёр, отработавшие по 35 лет, получат одинаковую базовую часть.\n\nСолидарная пенсия. Вот это самое интересное место, и именно о нём почти никто не знает.\n\nСолидарная пенсия – это наследство советской системы. Её назначают только тем, у кого был трудовой стаж по состоянию на 1 января 1998 года. Не после, а до. Тем, кто успел поработать при старой системе хотя бы полгода.\n\nОтец Алихана работал с восьмидесятых. У него этот стаж есть, и солидарная пенсия у него – самая большая часть выплаты.\n\nАлихану в январе девяносто восьмого было 14 лет. Солидарной пенсии у него не будет. Никакой. Ни большой, ни маленькой. Не\n\nпотому, что он что-то нарушил, а потому, что он появился на свет в это время. Это касается всех, кто родился примерно с 1980 года и позже. То есть большинства тех, кто читает эту книгу.\n\nТут стоит объяснить, почему так вышло. Не для оправдания государства, а чтобы понимать логику.\n\nСтарая система работала по принципу общего котла: те, кто сейчас работает, платят тем, кто сейчас на пенсии. Это честно и просто ровно до тех пор, пока работающих сильно больше, чем пенсионеров. В семидесятые годы так и было. Потом рождаемость упала, продолжительность жизни выросла, и котёл начал пустеть с обеих сторон одновременно: платящих становилось меньше, получающих – больше, платить приходилось дольше.\n\nКазахстан столкнулся с этим раньше многих других стран-соседей, и в девяносто восьмом первым на постсоветском пространстве перешёл на накопительную систему. Смысл её был заключён в одной фразе: теперь каждый копит себе сам, на своём счете, и получит ровно столько, сколько накопил.\n\nЭто не хорошо и не плохо. Это просто другие правила игры. Проблема в том, что правила поменяли двадцать восемь лет назад, а большинство участников об этом до сих пор не знает.\n\nНакопительная часть. Это то, что человек накопил сам, на своём счете. Обязательные пенсионные взносы (ОПВ) – 10 % от дохода. С 2024 года к ним добавились обязательные пенсионные взносы работодателя (ОПВР), которые платит не сам работник, а компания за сотрудников, рождённых после 1975 года (ИП платит сам за себя тоже). Ставка по этим взносам растёт по графику и в 2026 году составляет 3,5 %.\n\nЕсть важная деталь: взносы работодателя учитываются отдельно, на условном счёте, и по наследству они не передаются. Свои 10 % наследуются, эти 3,5 % – нет.\n\nТеперь соберём это вместе, сравнив пенсию Алихана и его отца. Средняя пенсия в Казахстане на начало 2026 года составила 157 843 теңге. Из них солидарная часть – 103 931 теңге, базовая – 53 912. Пенсионеров в стране 2,5 миллиона.\n\nТак вот. У сегодняшнего пенсионера две трети выплаты – это солидарная часть. Та самая, которой у поколения Алихана не будет. Уберите из 157 843 теңге сто три тысячи, и останется пятьдесят четыре.\n\nВот от какой цифры стартует человек, родившийся после восьмидесятого года. Всё остальное он должен накопить сам.\n\nЭто и есть главная новость этой книги.\n\nЛучше узнать об этом в 42 года, чем в 63.\n\nВернёмся к экрану, на который смотрел Алихан.\n\nНа счёте у него было около 4,8 миллиона теңге. Восемь лет наёмной работы, когда взносы шли с реальной зарплаты, и двенадцать лет в статусе предпринимателя, когда он платил 10 % от минимальной зарплаты (МЗП). Последние годы это 8 500 теңге в месяц1.\n\nМного это или мало, можно понять, если учесть рассчитываемый пенсионным фондом показатель. Он называется порогом достаточности и отражает сумму, которую нужно иметь на счёте в каждом возрасте, чтобы система считала Ваши накопления нормальными. На 2026 год пороги такие: 20 лет – 6,67 млн, 30 – 9,75 млн; 40 – 13,37 млн, для 42 лет – 14,16 млн.\n\nАлихану 42 года. Норматив для его возраста – около семи миллионов. Не хватает примерно двух миллионов.\n\nНо самое важное в этих цифрах не то, что Алихан до них не дотянул. Самое важное – это то, как они вообще рассчитаны.\n\nПорог достаточности исчисляется так, чтобы человек с учётом будущих взносов и инвестиционного дохода к моменту выхода на заслуженный отдых имел минимальную пенсию. В 2026 году это 69 049 теңге. Именно эта сумма заложена в методику расчёта вместе с минимальной зарплатой и прожиточным минимумом.\n\nПрочитайте это ещё раз. Порог достаточности не обозначает автоматически достойную старость. Он существует для того, чтобы человек не оказался за чертой бедности.\n\nСистема не обманывает. Она честно говорит вслух: вот минимум, ниже которого мы вас, дорогие граждане, не опустим. Всё дело в том, что минимум и цель – разные вещи, а слово «достаточность» сбивает с толку. Достаточность здесь означает достаточность для выживания, а не для жизни.\n\n1 Мы приводим в книге усреднённое значение минимального размера заработной платы (МЗП), так как за время работы ИП Алихана МЗП составляла и 22 459 теңге, и 42 500, и 70 000. Так что простоты расчётов берём последнее значение МЗП – 85 000 теңге.\n\nДалее Алихан сделал то, чего не делал никогда: посчитал, что будет к 63 годам.\n\nЧтобы не запутаться в процентах, есть простой приём. Если доходность фонда примерно равна инфляции, а в последние годы это близко к правде, то будущие проценты и будущий рост цен взаимно гасятся. Тогда считать можно вообще без них: сколько внёс, столько и получишь, только в актуальных деньгах.\n\nАлихан внёс 4,8 миллиона. Если он двадцать один год до пенсии продолжит платить те же 102 тысячи в год, он добавит ещё 2,1 миллиона.\n\nИтого около 7 миллионов теңге в сегодняшних деньгах (пока не берём в расчет инвестиционный доход для чистого счёта).\n\nВыплаты по возрасту растянутся примерно на 18-19 лет. 7 миллионов, поделённые на 19 лет, это 368 тысяч в год, или тридцать одна тысяча теңге в месяц. Плюс базовая пенсия – к тому времени у него будет полный стаж участия, значит, около шестидесяти тысяч. Итого примерно девяносто одна тысяча теңге.\n\nЕго отец получает сто пятьдесят восемь.\n\nИнженер, отработавший всю жизнь на зарплате, получает сейчас пенсию почти вдвое больше, чем будет получать предприниматель, который последние двенадцать лет зарабатывал в несколько раз больше отца.\n\nТаблица 1. Сравнительный анализ\n\nпенсионных выплат Алихана и его отца*\n\nОтец, 68 лет\n\nАлихан в 63 года Базовая пенсия\n\n53 900\n\nоколо 60 000\n\nСолидарная пенсия\n\n103 900\n\n0\n\nИз своих\n\nнет (уже выбрал)\n\nоколо 31 000\n\nнакоплений\n\nИтого в месяц\n\n157 800\n\nоколо 91 000\n\n*Указанные суммы приведены в актуальных на 2026 год деньгах, чтобы их можно было сравнивать. Расчёт учебный и является\n\nиллюстративным допущением.\n\nСамое неприятное в этой таблице – не нижняя строка. Самое неприятное во второй: ноль на месте той части, которая у сегодняшних пенсионеров составляет две трети выплаты.\n\nТеперь второй расчёт, и он важнее первого.\n\nЧто было бы, если бы Алихан платил обязательные взносы не с минимальной базы, а с реального дохода. Сейчас он платит 8 500 теңге в месяц – 10 % от минимальной зарплаты. Если бы он платил те же десять процентов со своего настоящего дохода, взнос был бы около 70 тысяч. Вот что из этого выходит через двадцать один год. Таблица 2. Сравнительный анализ текущих взносов\n\nАлихана (с МЗП) и взносов с его реального дохода\n\nПлатит\n\nПлатил бы\n\nс минимума\n\nс дохода\n\nВзнос в месяц\n\n8 500\n\n70 000\n\nНакопит за 21 год\n\n2 млн\n\n17,5 млн\n\nВсего на счете\n\n7 млн\n\n22 млн\n\nк 63 годам\n\nВыплата в месяц\n\n31 000\n\n98 000\n\n*Указанные суммы приведены в актуальных на 2026 год деньгах, чтобы их можно было сравнивать. Расчёт учебный и является\n\nиллюстративным допущением.\n\nВместе с базовой частью пенсии получаем те же сто пятьдесят восемь тысяч, что сейчас у отца.\n\nРазница между двумя сценариями не в удаче, не в кризисах и не в государстве. Разница целиком в одной строчке, которую Алихан однажды заполнил, открывая своё дело, и с тех пор ни разу не пересматривал.\n\nРаз уж мы разбираем устройство системы, следует упомянуть ещё о двух вещах, о которых спрашивают чаще всего.\n\nПервое: накопления наследуются. Деньги на пенсионном счёте – это Ваша собственность. Если человек не дожил до пенсии, они переходят наследникам. Это принципиально отличает накопительную часть от солидарной, которая просто исчезает вместе с че-\n\nловеком. Единственное исключение мы уже назвали: взносы работодателя, те самые 3,5 %, лежат на условном счёте и по наследству не передаются.\n\nВторое: излишки сверх порога можно снять. Если на счёте больше, чем требует порог достаточности для Вашего возраста, разницу разрешено использовать на жильё или лечение.\n\nК этой возможности стоит относиться очень осторожно. Она подаётся как расширение прав, и формально так и есть. Но по сути это изъятие денег из собственной старости. Человек, снявший излишек в сорок лет, вычитает его не из абстрактного счёта, а из своей выплаты в шестьдесят пять, и вычитает вместе со всем инвестиционным доходом, который эти деньги успели бы принести за двадцать лет.\n\nНеобходимо учитывать то, что мы только что выяснили о пороге допустимости: излишком считается всё, что сверх суммы, рассчитанной под минимальную пенсию.\n\n## ЧТО ОТВЕЧАЛИ В ЗАЛЕ\n\nВ анкетах Марафона финансовой грамотности был вопрос: «Из чего складывается Ваша будущая пенсия?» Варианты ответов следующие: «только государство», «только мои накопления», «и то и другое», «не знаю».\n\nКаждый третий выбрал «только государство». Более 40 % респондентов ответили «не знаю».\n\nОтдельно я спрашивал, знает ли человек сумму на своём пенсионном счёте хотя бы приблизительно. Точную цифру назвали единицы. Большинство честно признались, что не заходили туда ни разу. Это не безответственность. Никто никогда не показывал, куда смотреть. Никто не объяснял, почему это важно.\n\nОсталось последнее понятие, без которого не обойтись в этой книге.\n\nЭкономисты называют это коэффициентом замещения: какую долю прежнего дохода заменяет пенсия. Международная организация труда считает нижней приличной границей 40 %. Чтобы жить примерно так же, как в то время, когда Вы работали, нужно около 60–70 %.\n\nУ Алихана по первому сценарию выходит около 13 % от его нынешнего дохода.\n\nРазница между тем, что будет, и тем, что нужно, и есть Ваш разрыв. Дальше в книге это слово будет встречаться постоянно.\n\nУ разрыва есть неприятное свойство: он не появляется внезапно в шестьдесят три года. Он копится тихо, каждый месяц, ровной полосой на кардиограмме, и его размер известен заранее. Ровно за столько лет, сколько Вы готовы посчитать.\n\nЕсть и хорошее свойство: пока эти годы не кончились, разрыв поддаётся уменьшению. Это арифметика, а не приговор.\n\n## ЕСЛИ ВАМ ЗА СОРОК ПЯТЬ\n\nСделайте сегодня три вещи, это займёт полчаса.\n\nПервое: зайдите в личный кабинет пенсионного фонда и посмотрите сумму на счёте. Не приблизительно, а точно.\n\nВторое: посмотрите, был ли у Вас трудовой стаж до 1 января 1998 года. Если был хотя бы полгода, солидарная часть Вам положена, и картина у Вас лучше, чем у Алихана. Если не было, считайте по его схеме.\n\nТретье: поделите сумму на счёте на количество месяцев, которые Вы предполагаете прожить по достижении 63-летнего возраста. 230 месяцев – вполне разумная отправная точка. Полученная цифра плюс базовая пенсия и есть то, на что Вы сегодня можете рассчитывать.\n\nНа страницах этой книги Вы будете уточнять итоговую цифру. Но начинать надо с неё, какой бы она ни была сейчас.\n\nВ воскресенье вечером вернулась Динара с детьми. Дамир с порога начал рассказывать о бабушкиной собаке.\n\nАлихан дождался, пока дети улягутся, и сказал жене:\n\n– Я зашёл в приложение. Посмотрел, сколько у меня накоплено. – И сколько? – поинтересовалась Динара.\n\nАлихан назвал. Жена помолчала и, вздохнув, тихо произнесла: – А у меня, наверное, вообще ничего… Я же пять лет не работала. Он не нашёл, что ответить. За окном стремительно сгущалась темнота, а Алихан сидел и думал, что весь вечер считал пенсионные накопления только для одного человека – себя. В этой семье их вообще-то четверо, и у каждого свой отдельный срок, к которому нужны деньги. У Аяны университет через год. Дамиру поступать в\n\n2037 году. Сам Алихан достигнет пенсионного возраста в 2047 году. А у Динары свой срок, и об этом он, глава семьи, до этой минуты не думал ни разу.\n\nЧетыре даты. К каждой нужно готовиться по-разному.\n\nВот что стоит сказать, пока читатель не решил, что всё пропало.\n\nУ Алихана на самом деле неплохие стартовые условия, просто он их не замечает.\n\nЕму 42, а не 58. У него двадцать один год впереди, и это много. У него работающее дело и руки, которыми он умеет зарабатывать. У него нет ни одного просроченного долга. Он здоров. И он только что впервые в жизни посмотрел на свои цифры. Поверьте человеку, который провёл семинары по этой теме в четырнадцати городах, – это делает меньшинство.\n\nРазрыв у него есть. Но у него также есть всё, что нужно, чтобы этот разрыв закрыть. Собственно, вся эта книга посвящена тому, как именно этого добиться.\n\nОб этом мы поговорим в главе четвертой и в главе седьмой. А сейчас разберём, почему у человека, который работает на себя, всё устроено иначе, чем у наёмного.";

  var PREVIEW_KK = "## ПРОЛОГ\n\n1 қыркүйек, таңғы мезгіл, мектеп ауласы.\n\nДамир 7 жаста. Үстіндегі мектеп формасы өзіне сәл үлкендеу, иығынан салбырап тұр. Динара бір жылға еркін жетсін деген оймен әдейі бір өлшем үлкенін алған еді. Костюмнің жеңі алақанының жартысын жауып, жағасы сорайып тұр. Қолындағы гүл шоғы өзінен де үлкен. Оны қос қолымен бейне бір ауыр әрі тым нәзік, бағалы нәрсені ұстағандай қауіптене құшақтап, құлатып алмауға барынша тырысып бағады.\n\nӘлихан бұл сәтті телефонына таспалауда. Жанындағы Динара да түсіріп тұр. Жарты метр жерде қатар тұрып, екеуі де бір көріністі түсіруде. Бір-бірін сезсе де, ешқайсысы қолын төмен түсірер емес. Сәл оқшаулау жерде Аяна тұр. Уақыттың жүйрігін-ай! Ол да оныншы сыныпқа қадам басты… Жасы он алтыда. Құлағына құлаққап киіп, әдейі жалыққан кейіп танытып тұрғандай. Бірақ бұл жасанды немқұрайлылықтың артында оның бұл жерге біреудің мәжбүрлеуімен келгені байқалады. Тағы бір жылдан кейін оның да соңғы қоңырауы соғылмақ.\n\nӘлиханның әкесі Серік Қабдоллаұлы ұлының «Өзім барып алып келейін» дегеніне көнбей, қаланың қиыр шетінен автобуспен жетіпті. Жасы алпыс сегізде. Қолындағы таяғын мұқтаждықтан емес, көбіне салиқалы көріну үшін ұстайды. Жүрісі әлі де ширақ, ал таяғы, өзінің айтуынша, «шенеуніктермен сөйлескенде көмектеседі-мыс». Күртешесінің қалтасында немересіне арналған кәмпиті бар. Ол кәмпит бүкіл салтанатты жиын біткенше қалтада жатып, еріп те үлгерген.\n\nМектеп директоры микрофонмен сөйлеп жатыр. Аппаратурадан шыққан дыбыс құлақты жарады. Тыңдап жатқан жан баласы жоқ.\n\nКөп ұзамай орау қағаздар сыбдырлап, балалар жұпар иісті гүл шоқтарын сынып жетекшісіне ұсынды да, мектеп босағасында естелікке суретке түсті. Одан соң оқушыларды ішке алып кетті, ал ата-аналар болса асықпай, аулада елеусіз әңгіме айтып біраз бөгелді.\n\nӘлихан әкесін үйіне дейін көлікпен жеткізіп салды. Жол бойы олар көлік жайын, гаражын ақыры тұрғызып біткен көршісін және биылғы күздің ерте түскенін сөз етті. Үйдің алдына келгенде, әкесі қауіпсіздік белдігін ағытып жатып былай деді:\n\n– Кеше зейнетақы түсіпті. Үнемдеп жұмсасам, бір айға жетеді. Айта кету керек, әкесі шағымдануды ұнатпайтын, сирек налитын. Өзінің саяжайы бар, мұнда үш жылдан бері біздің өңірдің шілдедегі аптабына төзімді қызанақ сұрыптарын өсіріп жүр. Осы жолда нағыз зерттеушідей әдейі дәптер де арнаған. Дамирге көшеттерді көрсету үшін бейнеқоңырау шалуды да меңгеріп алған. Өз подъезінде төрағалық етеді, зауыттағы қырық жылдық еңбегінен де осы қызметін көбірек мақтан тұтатындай.\n\nКөңілі тоқ. Тек ақшасы үнемдеп өмір сүруге әрең жетеді. Бар болғаны – осы.\n\nМіне, дәл осы жерде жанға батарлық бір жайсыздық бар. Көсегесі көгермеген жоқшылық та, сорлаған бақытсыздық та емес. Әлиханның әкесі – еңбегі адал, беделді кісі, тек қаражаты келесі зейнетақыға дейін ғана жетеді. Одан өзге ештеңеге қоры да, қорғанысы да жоқ.\n\n«Бір айға жетеді», – деді байсалды үнмен. Әлихан бірдеңе істейді-ау немесе бірдеңе айтады-ау деген оймен айтқан жоқ. Ауа райының болжамын хабарлағандай жай ғана айта салды. Қырық жылдық еңбек өтілі бар. Инженер. Өмір бойы маңдай терін төкті, арамтамақ болған емес, жұмыссыз қалған жоқ. Енді, өйтіп-бүйтіп жеткізіп отырған жайы бар…\n\n– Керек-жарағың болса, айтып тұр, әке.\n\n– Бәрі дұрыс, айналайын.\n\nЕкеуі де дағдылы сөздерін қайталады, бұл жай ғана дәстүрлі қалып екенін екеуі де іштей сезетін.\n\nӘкесі үйіне қарай аяңдады. Әлихан оның артынан қарап тұрды да, жұмысына қарай бет алды.\n\nБағдаршамға аялдағанда ол есептей бастады. Әкесінің зей­ нетақысын емес. Өзінікін әлі де есептеуге құлықсыз еді. Ол ұлы Дамирдің келешек зейнетақысын есептей бастады.\n\nБірінші сынып. Демек, мектепті 11 жылдан кейін бітіреді. 2037 жыл. Дамир – 18-де болады. Аяна – 28-де, оң-солын таныған азаматша. Динара – 50-де. Ал өзінің жасы – 53-те болады.\n\n«2037 жыл», – деп іштей қайталаған ол бұл мерзімнің қаншалықты тосын естілгеніне, сонымен бірге қаншалықты таяп қалғанына да таңғалды. Осыдан 11 жыл бұрын Дамир бұл өмірде жоқ еді, бәрі кеше ғана болғандай көрінеді.\n\nЖасыл түс жанды.\n\nСонда барып Әлихан осы кітаптың арқауына айналған ойға тап болды.\n\nАяна үшін оның көңілі тоқ. Қыз бала 16-да. Тағы екі сынып аяқтаса, университетке түседі. Әлихан оған шамасы келетінін біледі. Жиған-тергені асып-тасып жатқандықтан емес – жинағаны азғантай. Өйткені әлі жас, 42-де ғана, кәсібі жүріп тұр, клиенттері бар, он екі мүшесі сау, ақыл-есі орнында. Қажет болса, табады. Артығырақ керек болса, оның да жолын қарастырады. Ол өмірдің «Қолыңнан келе ме?» деген сұрағына «Келеді!» деп жауап беретін шағында тұр, бұл мақтан емес, өз күшін айқын бағамдау еді.\n\nОл үлкен қызын оқыта алады. Бүгінгі Әлиханның оған әлі жетеді. Алайда Дамирді оқытатын бүгінгі Әлихан емес…\n\nДамирді мүлде өзге адам оқытады. 53 жастағы кісі. Әлихан ол адам туралы ештеңе білмейді. Оның осы кәсібі сақтала ма, жоқ па – оны да білмейді. Он бір жыл бұрын оның басқа ісі бар еді, ол компания қазір жоқ. Ол кезде ештеңе бүлінген емес, жай нарық өзгерді. Қазір ол өзінің денсаулығы қандай болатынын да білмейді. Әкесі 53 жасында тастай еді, ал 61-інде төсек тартып, жарты жыл бойы тұра алмады. Ол он бір жылдан кейін елімізде не болатынын, бағамның, оқу бағасының қайда шарықтайтынын мүлде болжай алмайды.\n\nОның өз ниетіне күмәні жоқ еді: ықылас та, ынта да болады. Ол өз мүмкіндігіне шек келтірді. Бұл, шындығында, еркектер жиі шатастыратын екі бөлек нәрсе еді.\n\nӘлиханның кеңседе, екі қоңыраудың арасында ойлаған тағы бір жайты бар еді, ол – Марат.\n\nАлыстағы ағайыны, өзінен бес жас үлкен. 2017 жылы Марат көпшілік сүйсіне қарайтын азамат еді: екі сауда орны, көлігі бар бо-\n\nлатын, көп саяхаттайтын. Кейін түксіз қалды, бұл ақымақтықтан немесе еріншектіктен емес, қолында бары бір жерде еді, ал ол жер жабылып қалды.\n\nМарат қазір жұмыс істейді. Еңбек етіп жүр, ақырындап еңсесін тіктеп келеді. Алайда оның үлкен қызы үшінші курстан кейін сырттай бөлімге ауысып, жұмысқа орналасты, өйткені оқу ақысын төлеуге қаражат қалмады. Бұл туралы отбасында ешкім дауыстап айтпайды.\n\nӘлихан мұны соның кебін киюден қорыққандықтан есіне алған жоқ. Ол бір қарапайым нәрсені ұқты: Маратта да ниет болған – тек мүмкіндік болмады.\n\nКешке, Дамир ұйқыға кеткен соң, Әлихан салтанатты жиынның суреттерін парақтады. Солардың бірінде үш буын – атасы, өзі және ұлы қатар тұр еді. Әлихан кенеттен бұл жай ғана сурет емес екенін ұғынды. Ол тұтас бір ұрпақтар сабақтастығына қарап тұр еді.\n\nӘкесі қолынан келгеннің бәрін жасап, нәтижесінде «ұқыпты жұмсаса, бір айға жететін» қаржыға қол жеткізді. Жаман жұмыс істегендіктен емес. Ол еңбек еткен жүйе уәде еткен нәтижені бере алмады, мұнда әкесінің еш айыбы жоқ еді. Ал Әлихан мүлде басқа жүйеде еңбек етуде. Бұл жерде ешкім ештеңеге уәде бермейді. Бәрі де өзіңе байланысты. Бұл сұсты естілгенімен, іс жүзінде әлдеқайда қайырлы, өйткені бәрі өзіңе байланысты болса, тым болмаса әрекет етуге мүмкіндігің бар. Тек не істеу керектігін білу маңызды.\n\nОл телефонын ашып, өзінің зейнетақы шотын көру үшін БЖЗҚ қосымшасына кіруге ұмтылды. Алайда құпиясөзді ұмытып калыпты. Тіпті Egov mobile қосымшасындағы құпиясөз де есінде қалмапты, оған соңғы рет қашан кіргенін де білмейді.\n\nЖасы 42-де. Екі баласы бар. Өз кәсібі бар. Ал шотында қанша қаражат барын білмейді. Түнгі он бірде құпиясөзді қалпына келтіріп жатпады. Телефонын ысырып қойып, ұйқыға кетті.\n\nБірақ 2037 жылдың 1 қыркүйегі күнтізбеден ешқайда жоғалған жоқ. Ол дәл 11 жылдан кейін анық келеді. Ол күні де мектеп ауласында жиын болады, тек бұл жолы мектеп бітіру салтанаты. Онда әкесінен жарты бас ұзын, ержеткен Дамир тұрады, ал қасында Әлихан әлі танымайтын 53 жастағы ересек адам тұратын болады. Ол болашақтағы адамның алаңсыз болғанын қалады.\n\nКітаптың негізгі бөлімі міне осы нүктеден басталады.\n\nБұдан әрі біз Қазақстанда зейнетақының қалай құралатынын және Әлиханның замандастарына неліктен әкелерінің жолымен жүруге сенім артуға болмайтынын егжей-тегжейлі талдаймыз. Оның болашақта қанша ақшасы болатынын және нақты қанша қажет екенін есептейміз. Әлихан сияқты өзін-өзі жұмыспен қамтып жүрген жандардың жайын бөлек сөз етеміз. Нидерланды, Германия, Сингапур және Жапониядағы отбасылардың бұл мәселені қалай шешкенін зерделейміз.\n\nСодан соң, осы мақсатқа жетуге мүмкіндік беретін қаржылық құралдарды кезекпен қарастырамыз. Отбасында тек бір адам жұмыс істегенде не істеу керек? Баланың жоғары оқу орнына қажетті қаражатты белгілі бір мерзімге қалай нақты жинауға болады? Зейнетақы аннуитеті деген не және ол неліктен біз ойлағаннан мүлдем бөлек дүние? Егер жұбайыңыздың жеке жинақтары жеткіліксіз болса, қандай қадамдар жасау қажет?\n\nСонымен қатар, әдетте жұрт айтуға бата алмайтын ең маңызды сұрақтарға жауап іздейміз. «Егер қаржы компаниясы жабылып қалса ше?», «Инфляция бәрін жеп қоймай ма?», «Мүмкін жылжымайтын мүлік тиімдірек шығар?», «Егер ақшамды қайтарып алғым келсе не істеймін?».\n\nАлдымен ең негізгісінен бастайық: сіздің зейнетақыңыз қалай есептеледі?\n\n## БІРІНШІ БӨЛІМ. Сіз қазір қай деңгейдесіз\n\n## 1-тарау. Қазақстандағы зейнетақы жүйесі қалай құрылған және сізге қанша қаражат жетіспейді\n\nОл құпиясөзді Әлихан сенбі күні таңертең қалпына келтірді.\n\nОны әдейі істеген жоқ. Динара балаларды ертіп, анасына кеткен. Үй іші тым-тырыс болып қалғанда, ол қыркүйектің басынан бері шетке ысырып қойған телефонын есіне алды. СМС-ке үш минут, жаңа құпиясөзге тағы екі минут кетті. Жаңасын ол сол сәтте-ақ ұмытып қалды.\n\nАқыры, ол жеке кабинетіне де кірді.\n\nЖоғарғы жағында – аты-жөні. Төменде – жинақталған қаражаттың жалпы сомасы. Одан да төменде – 20 жыл ай сайын аударылған жарналардың шежіресі.\n\nӘлихан бұл жолдарға жай оқи салмай, сұраулы жүзбен ұзақ үңілді. Көңілі қатты түсіп кетті деуге келмес. Тек мұның көп пе, әлде аз ба екенін ажырата алмады. Түпкі сома жеті таңбалы еді, құлаққа да жағымды, қомақты естіледі. Шамалап айтқанда, тәуірлеу көліктің бағасындай.\n\nСодан соң ол жарналар тарихын парақтады.\n\nАлғашқы кезең – 2014 жылға дейінгі аралық орнықты көрінді: сомалар әртүрлі, жылдан жылға өсіп отырған, жалақының көтерілгені байқалады. Ал одан әрі, өзінің жеке кәсібіне өткен айынан бастап, біркелкі, сұрғылт сызық созылған. Он екі жыл бойы ай сайын – бірдей сома. Бейне бір демеу беруге кеш қалған бейшара жанның кардиограммасы тәрізді.\n\nСұрғылт сызыққа қарап тұрып, бұл негізінен өзінің шешімі екенін ұқты. Кезінде өзі қабылдаған. Тек қалай қабылдағаны есінде жоқ.\n\nСол бір күнді есіне түсіруге тырысты. 2014 жыл. Кеңсе, компьютерге үңілген бойжеткен, үйілген қағаз, асығыс болғандықтан, әрі мұның бәрін құр сөз деп ұққандықтан, көз жүгіртпей берген жауаптары. Бір жерінде жарна есептелетін табыс мөлшері туралы сұрақ та бар еді. Ол ең төменгі соманы айта салған. Сараңдықтан емес. Сол сәтте оның қолында ешқандай табыс та жоқ еді, тек үш айдан соң біреуге қайта жалдануға тура келе ме деген үрей ғана бар болатын.\n\nҮш айдан соң біреуге жалданудың қажеті болмады. Ал жаңағы сома сол күйі өзгеріссіз қалды.\n\nОн екі жыл бойы…\n\nӘлиханның жинағы көп пе, әлде аз ба екенін бағамдау үшін, ең әуелі Қазақстанда зейнетақының қайдан құралатынын түсініп алу керек. Мұны баяндау бірнеше параққа созылар, бірақ онсыз сөз қоз­ ғаудың мәні жоқ.\n\nБізде зейнетақы үш бөліктен құралады.\n\nБазалық зейнетақы. Бұны зейнет жасына жеткен барша азаматқа мемлекеттік бюджеттен төлейді. Базалық төлемнің мөлшері адамның зейнетақы жүйесіне қатысқан жылдарына ғана байланысты. Егер қатысу өтілі он жылдан аз болса, базалық төлем ең төменгі күнелту деңгейінің 70 %-ын құрайды. Одан кейін ол жыл сайын өсіп, 34 жылдан астам өтілі барлар үшін 118 %-ға жетеді. 2026 жылдың ақшасымен есептесек, бұл – 35 596 теңгеден 60 005 теңгеге дейінгі аралық.\n\nМұқият болыңыз: базалық төлем адамның кезінде қанша табыс тапқанына мүлде қатыссыз. 35 жыл еңбек еткен зауыт директоры да, күзетші де бірдей базалық сома алады.\n\nЫнтымақты зейнетақы. Ең қызық әрі ешкім біле бермейтін тұсы – осы.\n\nЫнтымақты зейнетақы – кеңестік жүйеден қалған мұра. Ол 1998 жылғы 1 қаңтарға дейін еңбек өтілі бар азаматтарға ғана тағайындалады. Бұдан кейін емес, дәл сол мерзімге дейін еңбек еткендерге беріледі. Тіпті, ескі жүйеде жарты жыл болса да жұмыс істеп үлгергендерге арналған.\n\nӘлиханның әкесі сексенінші жылдардан бері жұмыс істеді. Оның мұндай өтілі бар, сондықтан ынтымақты төлем – оның зей­ нетақысының ең қомақты бөлігі.\n\nАл Әлихан тоқсан сегіздің қаңтарында 14 жаста еді. Оған ынтымақты төлем бұйырмайды. Ешқандай. Аз да, көп те берілмейді. Заң бұзғаны үшін емес, оның дүниеге келген уақыты солай болғандықтан. Бұл 1980 жылдардан кейін туғандардың бәріне қатысты. Яғни бұл кітапты оқып отырған оқырмандардың басым бөлігіне қатысты деген сөз.\n\nНеліктен олай болғанын да түсіндіре кеткен жөн. Мемлекетті ақтау үшін емес, логикасын ұғу үшін.\n\nЕскі жүйе «ортақ қазан» қағидасымен жұмыс істеді: бүгін жұмыс істейтіндер бұрынғы зейнеткерлерді асырайды. Бұл жұмысшылар саны зейнеткерлерден әлдеқайда көп болғанда ғана әділ әрі тиімді болушы еді. Сексенінші жылдары солай болды да. Кейін бала туу көрсеткіші төмендеп, өмір сүру ұзақтығы артты, сөйтіп «ортақ қазан» екі жақтан бірдей ортая бастады: төлейтіндер азайды, алатындар көбейді, ал төлеу мерзімі ұзарды.\n\nҚазақстан бұл бұралаңмен көрші елдерден бұрын бетпе-бет келіп, тоқсан сегізінші жылы посткеңестік кеңістікте бірінші болып жинақтаушы жүйеге көшті. Оның түпкі мәні бір-ақ сөйлемге сыятын: енді әркім өз шотына өзі жинайды және қанша жинаса, сонша алады.\n\nБұл жақсы да, жаман да емес. Бұл – жай ғана ойынның жаңа ережесі. Сұмдығы сонда, бұл ережелердің ауысқанына жиырма сегіз жыл өтсе де, қатысушылардың көбі бұдан әлі күнге дейін бейхабар. Жинақтаушы бөлік. Бұл – адамның өз шотында дербес жинаған қаржысы. Міндетті зейнетақы жарналары (МЗЖ) – табыстың 10 %-ы. 2024 жылдан бастап мұның қатарына жұмыс берушінің міндетті зейнетақы жарналары (ЖБМЗЖ) қосылды, оны қызметкердің өзі емес, 1975 жылдан кейін туған мамандары үшін компания төлейді (ЖК өзі үшін өзі төлейді). Бұл жарналардың мөлшерлемесі кестеге сай өсіп, 2026 жылы 3,5 %-ды құрады.\n\nАлайда, жұмыс берушінің жарналары шартты шотта бөлек есептеледі және мұрагерлікке қалдырылмайды. Сіздің 10 %-ыңыз мұраға қалады, ал бұл 3,5 % қалмайды.\n\nЕнді түйіндеп, Әлихан мен оның әкесінің зейнетақысын салыстырып көрейік.\n\n2026 жылдың басында Қазақстандағы орташа зейнетақы 157 843 теңгені құрады. Оның ішінде ынтымақты бөлік – 103 931 теңге, ал базалық бөлік – 53 912 теңге. Елде 2,5 миллион зейнеткер бар. Міне, қызық! Бүгінгі зейнеткер төлемінің үштен екісі – ынтымақты бөлік. Яғни Әлиханның буынында мүлде болмайтын төлем.\n\n157 843 теңгеден 103 мыңды алып тастасаңыз, 54 мың ғана қалады.\n\nСексенінші жылдан кейін туған адамның межесі осы саннан бастау алады. Қалғанының бәрін ол өзі жинауы тиіс.\n\nБұл – кітаптың ең негізгі жаңалығы.\n\nМұны 63 жаста емес, 42 жаста білген әлдеқайда қайырлы.\n\nӘлихан қарап тұрған экранға қайта оралайық.\n\nОның шотында шамамен 4,8 миллион теңге бар еді. Жарналар нақты жалақыдан ұсталған сегіз жылдық жалдамалы жұмыс және ең төменгі жалақының (ЕТЖ) 10 %-ын төлеп келген он екі жылдық кәсіпкерлік өтіл. Соңғы жылдары бұл – айына 8 500 теңге1.\n\nМұның аз-көптігін зейнетақы қоры есептейтін арнайы көрсеткіш арқылы түсінуге болады. Ол жеткіліктілік шегі деп аталады және жүйе сіздің жинағыңызды қалыпты деп санауы үшін әр жас аралығында шотта болуы тиіс соманы көрсетеді. 2026 жылға арналған шекті межелер мынадай: 20 жас – 6,67 млн; 30 жас – 9,75 млн; 40 жас – 13,37 млн, ал 42 жас үшін – 14,16 млн теңге.\n\nӘлихан 42-де. Оның жасы үшін меже – шамамен он төрт миллионнан астам. Сегіз миллионнан астам қаражат жетпей тұр.\n\nБірақ бұл сандардағы ең маңызды жайт – Әлиханның оған жете алмағаны емес. Ең маңыздысы – ол сандардың қалай есептелгенінде. Жеткіліктілік шегі адам зейнетке шыққанда болашақ жарналар мен инвестициялық табысты есепке ала отырып, ең төменгі зейнетақы алуы үшін есептеледі. 2026 жылы бұл – 69 049 теңге. Ең төменгі жалақы мен күнелту деңгейімен бірге есептеу әдістемесіне осы сома енгізілген.\n\nОсыны тағы бір мәрте оқып шығыңыз. Жеткіліктілік шегі қамсыз қарттықты білдірмейді. Ол адамның жоқшылықтың шегінде қалмауы үшін ғана құрылған.\n\n1 Бұл жерде Әлиханның ЖК жұмыс істеп тұрған уақытта ЕТЖ 22 459 теңге де, 42 500 де, 70 000 теңге де болғандықтан, біз кітапта ең төменгі жалақының (ЕТЖ) орташаланған мәнін келтіріп отырмыз. Есептеу оңай болуы үшін ЕТЖ-ның соңғы мәнін – 85 000 теңгені алдық.\n\nЖүйе алдамайды. Ол ашық айтады: құрметті азаматтар, сіздерді мына төменгі деңгейден асырып құлдилатпаймыз. Мәселе сонда, ең төменгі деңгей мен түпкі мақсат екі бөлек нәрсе, ал «жеткіліктілік» сөзі адамды адастырады. Мұндағы жеткіліктілік – толыққанды өмір сүру үшін емес, жай ғана аман қалу үшін жеткілікті деген сөз.\n\nОдан кейін Әлихан ешқашан істеп көрмеген қадамға барды: 63 жасқа келгенде не болатынын есептеп көрді.\n\nПайыздардан шатаспау үшін қарапайым тәсіл бар. Егер қордың кірістілігі шамамен инфляциямен тең болса, ал соңғы жылдары бұл шындыққа жақын, онда болашақ пайыздар мен бағаның қымбаттауы бір-бірін жабады. Онда пайыздарды мүлде есепке алмай-ақ қоюға болады: қанша салсаң, соны қазіргі бағаның баламасымен аласың. Әлихан 4,8 миллион салған. Егер ол зейнетке дейінгі жиырма бір жыл бойы жылына сондай 102 мың төлеуді жалғастырса, тағы 2,1 миллион қосады. Нәтижесінде бүгінгі ақшамен есептегенде 7 миллион теңгедей жиналады (әзірге таза есеп үшін инвестициялық кірісті қоспаймыз). Жасы бойынша төлемдер шамамен 18-19 жылға созылады. 7 миллионды 19 жылға бөлсеңіз, жылына 368 мың, немесе айына отыз бір мың теңгеден келеді. Оған базалық зей­ нетақыны қосыңыз – ол кезде оның қатысу өтілі толық болады, демек, шамамен алпыс мың теңге. Жиыны шамамен тоқсан бір мың теңге шығады. Ал оның әкесі жүз елу сегіз мың алады.\n\nӨмір бойы белгіленген жалақыға еңбек еткен инженер қазір соңғы он екі жылда әкесінен бірнеше есе көп табыс тапқан кәсіпкерге қарағанда екі есеге жуық көп зейнетақы алады.\n\n1-кесте. Әлихан мен оның әкесінің зейнетақы\n\nтөлемдерін салыстырмалы талдау*\n\nӘкесі 68 жаста\n\nӘлихан 63 жаста\n\nБазалық зейнетақы\n\n53 900\n\nшамамен 60 000\n\nЫнтымақты зейнетақы\n\n103 900\n\n0\n\nӨз жинағынан\n\nжоқ (алып қойған)\n\nшамамен 31 000\n\nЖинағы айына\n\n157 800\n\nшамамен 91 000\n\n*Келтірілген сомалар салыстыруға қолайлы болуы үшін 2026\n\nжылғы нақты ақша бағамымен берілген. Есептеу оқу-танымдық сипатқа ие және түсіндіру мақсатындағы болжам болып табылады.\n\nОсы кестедегі ең жаман нәрсе – ең төменгі баған емес. Ең сорақысы – екінші баған: бүгінгі зейнеткерлер төлемінің үштен екісін құрайтын бөліктің орнындағы жайнап тұрған нөл.\n\nЕнді екінші есепке көшейік, бұл біріншісінен де маңыздырақ.\n\nЕгер Әлихан міндетті жарналарды ең төменгі базадан емес, нақты табысынан төлегенде не болар еді? Қазір ол айына 8500 теңге төлейді – бұл ең төменгі жалақының 10 %-ы. Егер ол сол он пайызды өз табысынан төлегенде, жарна көлемі шамамен 70 мың теңге болар еді. Міне, жиырма бір жылдан кейін мынандай көрініс шығады. 2-кесте. Әлиханның қазіргі жарналарын (ЕТЖ-дан) және нақты табысынан түсетін жарналарды салыстырмалы талдау\n\nЕң төменгі\n\nТабысынан\n\nдеңгейден\n\nтөлесе\n\nАй сайынғы жарна\n\n8 500\n\n70 000\n\n21 жылда\n\n2 млн\n\n17,5 млн\n\nжиналатыны\n\n63 жастағы жалпы\n\n7 млн\n\n22 млн\n\nсома\n\nАй сайынғы төлем\n\n31 000\n\n98 000\n\n* Келтірілген сомалар салыстыруға қолайлы болуы үшін 2026 жылғы нақты ақша бағамымен берілген. Есептеу оқу-танымдық сипатқа ие және түсіндіру мақсатындағы болжам болып табылады.\n\nБазалық бөлікпен бірге қазір әкесі алып жүрген сол бір жүз елу сегіз мың теңге шығады.\n\nЕкі сценарий арасындағы айырмашылық сәттілікте де, дағдарыста да немесе мемлекетте де емес. Бар айырмашылық – Әлиханның кәсібін ашқан кезде бір рет толтырып, содан бері бір де бір рет қайта қарамаған сол бір жалғыз жолында.\n\nЖүйенің жұмысын талдап жатқан соң, ең көп қойылатын тағы екі сұраққа тоқтала кеткен жөн.\n\nБіріншісі: жинақ қаражаты мұраға қалады. Зейнетақы шотындағы ақша – сіздің жеке меншігіңіз. Егер адам зейнет жасына жетпей қайтыс болса, ол қаражат мұрагерлеріне өтеді. Бұл жинақтаушы бөлікті адаммен бірге жоқ болып кететін ынтымақтасты бөліктен түбегейлі ерекшелендіреді. Біз атап өткен жалғыз ерекшелік: жұмыс\n\nберушінің жарналары, яғни әлгі 3,5 % шартты шотта жатады және мұрагерлікке берілмейді.\n\nЕкіншісі: шектен асқан артық соманы шешіп алуға болады. Егер шоттағы қаражат жасыңызға тиесілі жеткіліктілік шегінен артық болса, айырмашылығын тұрғын үй жағдайын жақсартуға немесе ем қабылдауға пайдалануға рұқсат етіледі.\n\nБұл мүмкіндікке өте сақтықпен қараған жөн. Ол құқықтардың кеңеюі ретінде ұсынылады, ресми түрде солай да шығар. Бірақ түп мәнінде бұл – өз қарттығыңыздың қаржысын қысқарту деген сөз. Қырық жасында артық соманы шешіп алған адам ол ақшаны абстрактілі шоттан емес, алпыс бес жастағы өз төлемінен азайтады, әрі бұл азайту осы қаражаттың жиырма жыл ішінде әкелуге тиіс барлық инвестициялық кірісімен бірге алынып тасталады.\n\nЖеткіліктілік шегі туралы жаңа ғана анықтаған мына жайтты ескеру қажет: ең төменгі зейнетақыға арналған есептелген сомадан жоғары тұрған кез келген қаржы артық сома болып есептеледі.\n\n## ЗАЛДАҒЫЛАР НЕ ДЕП ЖАУАП БЕРДІ\n\nҚаржылық сауаттылық марафонының сауалнамасында мынадай сұрақ болды: «Болашақ зейнетақыңыз неден құралады?» Жа­ уап нұсқалары келесідей еді: «тек мемлекет», «тек менің жинағым», «екеуі де», «білмеймін».\n\nӘрбір үшінші адам «тек мемлекет» дегенді таңдаған. Респонденттердің 40 %-дан астамы «білмеймін» деп жауап берді.\n\nОдан бөлек өз зейнетақы шотындағы соманы ең болмаса шамамен білетіндер бар ма екенін сұраған едім. Нақты санды айналдырған санаулы ғана адам атады. Көпшілігі ол жаққа бірде-бір рет бас сұқпағанын шынайы мойындады.\n\nБұл – жауапсыздық емес. Өйткені оларға қайда қарау керектігін ешкім көрсетпеген, мұның маңыздылығын да ешкім түсіндірмеген. Бұл кітапта айналып өтуге болмайтын соңғы ұғым қалды.\n\nЭкономистер мұны алмастыру коэффициенті деп атайды: зейнетақы бұрынғы табыстың қандай үлесін алмастырады. Халықаралық еңбек ұйымы ең төменгі лайықты шекті 40 % деп есептейді. Жұмыс істеген кезіңіздегідей өмір сүру үшін шамамен 60–70 % қажет.\n\nӘлиханның бірінші сценарийі бойынша қазіргі табысының шамамен 13 %-ы ғана шығады.\n\nБолашақта болатын жағдай мен қажетті сома арасындағы айырмашылық – бұл сіздің қаржылық алшақтығыңыз. Кітаптың келесі бөлімдерінде бұл сөз жиі кездеседі.\n\nАлшақтықтың бір жағымсыз қасиеті бар: ол алпыс үш жаста кенет пайда бола қоймайды. Ол жүрек соғысының сызығындай біркелкі болып, ай сайын тыныш қана жиналады, ал оның мөлшері алдын ала белгілі. Сіз есептей алатын жылдар санына дәл сәйкес келеді. Жағымды жағы да бар: бұл жылдар бітпей тұрып, алшақтықты азайтуға болады. Бұл үкім емес, қарапайым арифметика.\n\n## ЕГЕР ЖАСЫҢЫЗ ҚЫРЫҚ БЕСТЕН АССА\n\nБүгін үш әрекетті жасаңыз, бұл жарты сағат уақытыңызды алады.\n\nБіріншісі: зейнетақы қорының жеке кабинетіне кіріп, шоттағы соманы қараңыз. Шамамен емес, нақты біліңіз.\n\nЕкіншісі: 1998 жылдың 1 қаңтарына дейін еңбек өтіліңіздің болған-болмағанын тексеріңіз. Егер кем дегенде жарты жыл өтіліңіз болса, ынтымақтасты бөлік сізге де тиесілі, демек жағдайыңыз Әлиханға қарағанда жақсырақ. Егер болмаса, оның әдісімен есептеңіз.\n\nҮшіншісі: шоттағы соманы 63 жасқа жеткеннен кейін өмір сүремін деп болжайтын айлар санына бөліңіз. 230 ай – өте орынды бастапқы нүкте. Шыққан санға базалық зейнетақыны қоссаңыз, бұл – бүгінгі таңда арқа сүйей алатын қаражатыңыз.\n\nБұл кітаптың беттерінде сіз түпкілікті соманы нақтылай түсесіз. Бірақ қазір қандай болса да, есепті сол сомадан бастау керек.\n\nЖексенбі күні кешке Динара балалармен бірге оралды. Дамир босағадан аттамай жатып әжесінің иті туралы әңгімелей бастады.\n\nӘлихан балалардың ұйқыға кеткенін күтіп, әйеліне былай деді: – Мен қосымшаға кірдім. Қанша жиналғанын қарадым.\n\n– Қанша екен? – деп сұрады Динара.\n\nӘлихан санды атады. Әйелі үнсіз қалып, күрсінді де, баяу дауыспен:\n\n– Ал менде, шамасы, түкте жоқ шығар… Мен бес жыл бойы жұмыс істемедім ғой, – деді Динара.\n\nОл не дерін білмеді. Терезе сыртындағы қараңғылық қоюланып бара жатты, ал Әлихан осы кеш бойы зейнетақы жинағын тек бір адамға – өзіне ғана есептегенін ойлап отырды. Бұл отбасында негі-\n\nзінен төрт адам бар, әрқайсысының ақша қажет болатын өз уақыты бар. Аяна бір жылдан соң университетке түседі. Дамир 2037 жылы оқуға түсуі тиіс. Әлиханның өзі 2047 жылы зейнет жасына жетеді. Ал Динараның өз уақыты бар, оны осы минутқа дейін отбасы басшысы ретінде ол бір рет те ойламапты.\n\nТөрт түрлі дата. Әрқайсысына әртүрлі дайындалу керек.\n\nОқырман бәрі бітті деп ойлап қалмас бұрын мынаны айту керек.\n\nӘлиханның бастапқы жағдайы жаман емес, тек ол оны байқамай жүр. Ол 58-де емес, 42-де. Алдында жиырма бір жылы бар, бұл – аз уақыт емес. Жұмыс істеп тұрған кәсібі мен адал еңбек ететін қолдары бар. Бір де бір мерзімі өткен қарызы жоқ. Дені сау. Және ол өмірінде бірінші рет өз сандарына көз жүгіртті. Осы тақырып бойынша 14 қалада семинар өткізген адам ретінде айтайын – мұны санаулы ғана адам жасайды.\n\nӘрине, белгілі бір алшақтық бар. Бірақ соны жоюға қажетті мүмкіндіктің бәрі өз қолында. Шын мәнінде, бұл кітап дәл осы мақсатқа жеткізетін жолдар туралы баяндайды.\n\nБұл туралы төртінші және жетінші тарауларда сөз етеміз. Ал қазір өзін-өзі жұмыспен қамтыған адамның жағдайы неліктен жалдамалы қызметкерден өзгеше екенін талдайық.";

      '<div class="bars">' + bars + "</div>";

  function commentsOf(reviewId) {
    return S.comments.filter(function (c) { return c.reviewId === reviewId; });
  }

  function threadHTML(reviewId) {
    var L = t(), all = commentsOf(reviewId);
    function branch(parentId, depth) {
      var kids = all.filter(function (c) { return (c.parentId || "") === parentId; })
        .sort(function (a, b) { return String(a.createdAt).localeCompare(String(b.createdAt)); });
      if (!kids.length) return "";
      var html = "";
      kids.forEach(function (c) {
        var isReplying = S.replyTo && S.replyTo.reviewId === reviewId && S.replyTo.parentId === c.id;
        html += '<div class="node">' +
          '<div class="body"><div class="meta"><b>' + esc(c.name) + "</b><span>" + esc(when(c.createdAt)) + "</span></div>" +
          "<p>" + esc(c.text) + "</p></div>" +
          '<button type="button" class="replybtn" data-reply="' + esc(reviewId) + '" data-parent="' + esc(c.id) + '">' + esc(L.reply) + "</button>" +
          (isReplying ? replyBoxHTML() : "") +
          (depth < 6 ? '<div class="kids">' + branch(c.id, depth + 1) + "</div>" : "") +
          "</div>";
      });
      return html;
    }
    var rootReplying = S.replyTo && S.replyTo.reviewId === reviewId && S.replyTo.parentId === "";
    var body = branch("", 0);
    return '<div class="thread"><p class="thread-title">' + esc(L.thread) +
      (all.length ? " · " + esc(L.comments(all.length)) : "") + "</p>" +
      (body || '<p class="score-meta" style="margin:0">' + esc(L.noComments) + "</p>") +
      (rootReplying ? replyBoxHTML() :
        '<button type="button" class="cta ghost small" data-reply="' + esc(reviewId) + '" data-parent="">' + esc(L.reply) + "</button>") +
      "</div>";
  }

  function sumStat(field, days) {
    var total = 0;
    if (days === null) {
      Object.keys(S.stats).forEach(function (k) { total += (S.stats[k][field] || 0); });
      return total;
    }
    for (var i = 0; i < days; i++) {
      var row = S.stats[dayKeyOffset(i)];
      if (row) total += (row[field] || 0);
    }
    return total;
  }

  function renderStats() {
    if (!S.admin || !S.authed) return "";
    var L = t();
    function tile(n, l) {
      return '<div class="stat"><span class="n">' + n + '</span><span class="l">' + esc(l) + "</span></div>";
    }
    var cards =
      tile(sumStat("visits", 1), L.stVisits + " · " + L.stToday) +
      tile(sumStat("visits", 7), L.stVisits + " · " + L.st7) +
      tile(sumStat("reads", 30), L.stReads + " · " + L.st30) +
      tile(sumStat("downloads", 30), L.stDownloads + " · " + L.st30) +
      tile((S.total && S.total.downloads) || 0, L.stDownloads + " · " + L.stAll) +
      tile((S.total && S.total.downloadsKk) || 0, L.stDownloadsKk + " · " + L.stAll);

    var days = [], max = 1;
    for (var i = 29; i >= 0; i--) {
      var k = dayKeyOffset(i), row = S.stats[k] || {};
      var v = row.visits || 0;
      days.push({ k: k, v: v });
      if (v > max) max = v;
    }
    var bars = days.map(function (d) {
      var h = d.v ? Math.max(4, Math.round((d.v / max) * 70)) : 0;
      return '<span class="' + (d.v ? "" : "zero") + '" style="height:' + h + 'px" title="' +
        d.k + ": " + d.v + '"></span>';
    }).join("");

    return '<section class="admin"><h2>' + esc(L.statsTitle) + "</h2>" +
      '<div class="statgrid">' + cards + "</div>" +
      '<div><div class="l" style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">' +
      esc(L.stChart) + " · " + esc(L.stVisits.toLowerCase()) + "</div>" +
      '<div class="spark">' + bars + "</div>" +
      '<div class="spark-legend"><span>' + days[0].k.slice(5) + "</span><span>" + days[29].k.slice(5) + "</span></div></div>" +
      '<p class="form-hint" style="margin:0">' + esc(L.statsHint) + "</p></section>";
  }
