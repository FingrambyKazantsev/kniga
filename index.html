<style>
  :root {
    --bg: #EEF1E6;
    --bg-tint: #E4EAD9;
    --surface: #FBFCF6;
    --surface-2: #F4F7EC;
    --line: #D6DEC8;
    --ink: #1E2A1F;
    --ink-2: #3E4F3D;
    --muted: #6B7A64;
    --accent: #2C7A57;
    --accent-soft: #DCEDE1;
    --accent-ink: #1C5A3E;
    --honey: #C88A18;
    --honey-soft: #F6E7C2;
    --shadow: 0 1px 2px rgba(31,47,31,.05), 0 8px 24px -12px rgba(31,47,31,.18);
    --on-accent: #FFFFFF;
    --danger: #A8402A;
    --radius: 14px;
    --maxw: 1140px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141A14;
      --bg-tint: #1A211A;
      --surface: #1D251D;
      --surface-2: #232C22;
      --line: #32402F;
      --ink: #E9EFE1;
      --ink-2: #C6D2BE;
      --muted: #94A38D;
      --accent: #63C295;
      --accent-soft: #23372C;
      --accent-ink: #9BDDBA;
      --honey: #E5B84D;
      --honey-soft: #3A3018;
      --on-accent: #0F1A13;
      --danger: #F0967C;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #141A14;
    --bg-tint: #1A211A;
    --surface: #1D251D;
    --surface-2: #232C22;
    --line: #32402F;
    --ink: #E9EFE1;
    --ink-2: #C6D2BE;
    --muted: #94A38D;
    --accent: #63C295;
    --accent-soft: #23372C;
    --accent-ink: #9BDDBA;
    --honey: #E5B84D;
    --honey-soft: #3A3018;
    --on-accent: #0F1A13;
    --danger: #F0967C;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Golos Text", "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 20px; }

  /* ---------- header ---------- */
  header.top {
    background: linear-gradient(180deg, var(--bg-tint) 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--line);
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding-block: 14px;
  }
  .brandmark {
    display: flex; align-items: center; gap: 9px;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
  }
  .brandmark svg { display: block; }
  .langs { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .langs button {
    font: inherit; font-size: 13px; font-weight: 600; letter-spacing: .02em;
    border: 0; background: transparent; color: var(--muted);
    padding: 5px 12px; border-radius: 999px; cursor: pointer;
  }
  .langs button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); }

  .hero { padding-block: 26px 34px; display: grid; gap: 22px; grid-template-columns: minmax(0,1.4fr) minmax(0,.85fr); align-items: end; }
  @media (max-width: 760px) { .hero { grid-template-columns: 1fr; align-items: start; gap: 24px; } }
  .eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent-ink); font-weight: 600; margin: 0 0 10px; }
  h1 {
    font-family: Literata, Georgia, "Times New Roman", serif;
    font-weight: 600; font-size: clamp(30px, 5.2vw, 50px); line-height: 1.08;
    margin: 0 0 12px; text-wrap: balance; letter-spacing: -.015em;
  }
  h1 .draft-title { color: var(--muted); font-style: italic; }
  .lede { margin: 0; color: var(--ink-2); font-size: 17px; max-width: 54ch; }
  .byline { margin: 10px 0 0; color: var(--muted); font-size: 14px; }

  .scorecard {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px 20px; box-shadow: var(--shadow); display: grid; gap: 14px;
  }
  .score-row { display: flex; align-items: baseline; gap: 12px; }
  .score-num {
    font-family: Literata, Georgia, serif; font-size: 42px; line-height: 1;
    font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .score-meta { font-size: 13.5px; color: var(--muted); }
  .bars { display: grid; gap: 5px; }
  .bar { display: grid; grid-template-columns: 34px 1fr 30px; align-items: center; gap: 9px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar .track { height: 7px; border-radius: 99px; background: var(--bg-tint); overflow: hidden; }
  .bar .fill { height: 100%; background: var(--honey); border-radius: 99px; transition: width .5s ease; }

  .stars { display: inline-flex; gap: 2px; line-height: 0; }
  .stars svg { width: 15px; height: 15px; display: block; }
  .star-on { fill: var(--honey); }
  .star-off { fill: none; stroke: var(--line); stroke-width: 1.6; }

  /* ---------- write bar ---------- */
  .writebar { padding-block: 0 4px; }
  .cta {
    font: inherit; font-weight: 600; font-size: 16px;
    background: var(--accent); color: var(--on-accent); border: 0; border-radius: 999px;
    padding: 13px 26px; cursor: pointer; box-shadow: var(--shadow);
    transition: transform .15s ease, filter .15s ease;
  }
  .cta:hover { filter: brightness(1.05); transform: translateY(-1px); }
  .cta:active { transform: translateY(0); }
  .cta.ghost { background: transparent; color: var(--accent-ink); border: 1px solid var(--line); box-shadow: none; }
  .cta.small { font-size: 14px; padding: 9px 16px; }

  /* ---------- form ---------- */
  .form-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 22px; margin-block: 18px 6px;
  }
  .form-card h2 { font-family: Literata, Georgia, serif; font-size: 22px; margin: 0 0 4px; font-weight: 600; }
  .form-hint { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .fields { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 620px) { .fields { grid-template-columns: 1fr; } }
  .field { display: grid; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  label { font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: .01em; }
  label .opt { font-weight: 400; color: var(--muted); }
  input[type="text"], input[type="password"], textarea {
    font: inherit; color: var(--ink); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; width: 100%;
    resize: vertical;
  }
  input[type="text"]:focus-visible, input[type="password"]:focus-visible, textarea:focus-visible, button:focus-visible, .cell:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  textarea { min-height: 120px; line-height: 1.55; }
  .starpick { display: flex; gap: 4px; align-items: center; }
  .starpick button { background: none; border: 0; padding: 3px; cursor: pointer; line-height: 0; }
  .starpick svg { width: 27px; height: 27px; }
  .starpick .label { margin-left: 8px; font-size: 13.5px; color: var(--muted); }
  .form-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 18px; }
  .err { color: var(--danger); font-size: 13.5px; }

  /* ---------- grid of cells ---------- */
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 14px;
    flex-wrap: wrap; margin: 34px 0 14px;
  }
  .section-head h2 { font-family: Literata, Georgia, serif; font-size: 25px; margin: 0; font-weight: 600; }
  .count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); align-items: start; }
  .cell {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 17px; cursor: pointer; text-align: left; font: inherit; color: inherit;
    display: grid; gap: 9px; width: 100%; transition: border-color .18s ease, transform .18s ease;
  }
  .cell:hover { border-color: var(--accent); transform: translateY(-1px); }
  .cell.open { grid-column: 1 / -1; cursor: default; box-shadow: var(--shadow); border-color: var(--accent); }
  .cell.example { border-style: dashed; background: transparent; cursor: default; }
  .cell-head { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-weight: 600; font-size: 14px;
    background: var(--accent-soft); color: var(--accent-ink);
  }
  .who { display: grid; gap: 1px; min-width: 0; }
  .who .nm { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .mt { font-size: 12.5px; color: var(--muted); }
  .cell-head .stars { margin-left: auto; flex: none; }
  .snippet {
    margin: 0; color: var(--ink-2); font-size: 15px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .cell-foot { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .chip-count {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 10px; font-size: 12.5px;
  }
  .more { margin-left: auto; color: var(--accent-ink); font-weight: 600; font-size: 13px; }
  .badge-example {
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600;
    color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px;
  }

  .full-text { margin: 0; font-size: 16.5px; line-height: 1.65; color: var(--ink); white-space: pre-wrap; }
  .full-text + .thread { margin-top: 6px; }

  /* ---------- thread ---------- */
  .thread { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 12px; }
  .thread-title { font-size: 12px; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0; }
  .node { display: grid; gap: 7px; }
  .node .body {
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 11px 13px; display: grid; gap: 5px;
  }
  .node .meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .node .meta b { color: var(--ink); font-size: 13.5px; font-weight: 600; }
  .node p { margin: 0; font-size: 15px; white-space: pre-wrap; }
  .kids { display: grid; gap: 12px; margin-left: 16px; padding-left: 14px; border-left: 2px solid var(--line); }
  .replybtn { background: none; border: 0; padding: 0; font: inherit; font-size: 13px; font-weight: 600; color: var(--accent-ink); cursor: pointer; justify-self: start; }
  .replybox { background: var(--surface-2); border: 1px solid var(--accent); border-radius: 12px; padding: 12px; display: grid; gap: 9px; }
  .quick { display: flex; gap: 7px; flex-wrap: wrap; }
  .quick button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 12px; color: var(--ink-2);
  }
  .quick button:hover { border-color: var(--accent); color: var(--accent-ink); }
  .replybox .row { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
  .replybox input[type="text"] { max-width: 220px; }

  /* ---------- states ---------- */
  .empty {
    border: 1px dashed var(--line); border-radius: var(--radius); padding: 26px;
    text-align: center; color: var(--muted); grid-column: 1 / -1;
  }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    background: var(--accent); color: var(--on-accent); padding: 12px 20px; border-radius: 999px;
    font-weight: 600; font-size: 15px; box-shadow: var(--shadow); z-index: 50;
  }
  .notice {
    background: var(--honey-soft); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 13px 16px; font-size: 14px; color: var(--ink-2); margin-block: 16px;
  }

  /* ---------- admin ---------- */
  .admin {
    background: var(--surface); border: 1px dashed var(--accent); border-radius: var(--radius);
    padding: 18px; margin-block: 18px; display: grid; gap: 12px;
  }
  .admin h2 { margin: 0; font-size: 17px; font-family: Literata, Georgia, serif; font-weight: 600; }
  .admin .fields { grid-template-columns: 1fr 1fr; }
  .hide-btn { background: none; border: 0; font: inherit; font-size: 12.5px; color: var(--muted); cursor: pointer; text-decoration: underline; padding: 0; }
  .cell.hidden-rev { opacity: .5; }

  footer.foot { border-top: 1px solid var(--line); margin-top: 44px; padding-block: 24px 40px; color: var(--muted); font-size: 13.5px; }
  footer.foot a { color: var(--accent-ink); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

<main class="wrap">

  function commentsOf(reviewId) {

  function threadHTML(reviewId) {
    var L = t(), all = commentsOf(reviewId);
    function branch(parentId, depth) {
      var kids = all.filter(function (c) { return (c.parentId || "") === parentId; })
        .sort(function (a, b) { return String(a.createdAt).localeCompare(String(b.createdAt)); });
      if (!kids.length) return "";
      var html = "";
      kids.forEach(function (c) {
        var isReplying = S.replyTo && S.replyTo.reviewId === reviewId && S.replyTo.parentId === c.id;
        html += '<div class="node">' +
          '<div class="body"><div class="meta"><b>' + esc(c.name) + "</b><span>" + esc(when(c.createdAt)) + "</span></div>" +
          "<p>" + esc(c.text) + "</p></div>" +
          '<button type="button" class="replybtn" data-reply="' + esc(reviewId) + '" data-parent="' + esc(c.id) + '">' + esc(L.reply) + "</button>" +
          (isReplying ? replyBoxHTML() : "") +
          (depth < 6 ? '<div class="kids">' + branch(c.id, depth + 1) + "</div>" : "") +
          "</div>";
      });
      return html;
    }
    var rootReplying = S.replyTo && S.replyTo.reviewId === reviewId && S.replyTo.parentId === "";
    var body = branch("", 0);
    return '<div class="thread"><p class="thread-title">' + esc(L.thread) +
      (all.length ? " · " + esc(L.comments(all.length)) : "") + "</p>" +
      (body || '<p class="score-meta" style="margin:0">' + esc(L.noComments) + "</p>") +
      (rootReplying ? replyBoxHTML() :

  /* ===================== события ===================== */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-lang],[data-open],[data-close],[data-reply],[data-quick],[data-rate],[data-hide],#open-form,#f-send,#f-cancel,#reply-send,#reply-cancel,#a-save,#l-in,#l-out");
    if (!el) return;

    if (el.dataset.lang) {
      S.lang = el.dataset.lang;
      try { localStorage.setItem("book-reviews-lang", S.lang); } catch (x) {}
      return render();
    }
    if (el.id === "open-form") {
      S.form.open = !S.form.open; S.form.error = "";
      render();
      if (S.form.open) { var f = document.getElementById("f-name"); if (f) f.focus(); }
      return;
    }
    if (el.dataset.open) { S.open[el.dataset.open] = true; return render(); }
    if (el.dataset.close) { delete S.open[el.dataset.close]; S.replyTo = null; return render(); }
    if (el.dataset.reply !== undefined && el.dataset.parent !== undefined) {
      captureDraft();
      S.replyTo = { reviewId: el.dataset.reply, parentId: el.dataset.parent };
      return render();
    }
    if (el.dataset.quick) {
      var box = document.getElementById("reply-text");
      if (box) { box.value = (box.value ? box.value.replace(/\s*$/, " ") : "") + el.dataset.quick + ". "; box.focus(); }
      return;
    }
    if (el.dataset.rate) { captureForm(); S.form.rating = +el.dataset.rate; S.form.error = ""; return render(); }
    if (el.id === "f-cancel") { S.form = { open: false, name: "", city: "", rating: 0, text: "", error: "" }; return render(); }
    if (el.id === "f-send") return submitReview();
    if (el.id === "reply-cancel") { S.replyTo = null; S.draft = { name: "", text: "" }; return render(); }
    if (el.id === "reply-send") return submitComment();
    if (el.dataset.hide) return toggleHide(el.dataset.hide);

  function captureForm() {
    var n = document.getElementById("f-name"), c = document.getElementById("f-city"), x = document.getElementById("f-text");
    if (n) S.form.name = n.value;
    if (c) S.form.city = c.value;
    if (x) S.form.text = x.value;
  }
  function captureDraft() {
    var n = document.getElementById("reply-name"), x = document.getElementById("reply-text");
    if (n) S.draft.name = n.value;
    if (x) S.draft.text = x.value;
  }

  function newId() {
    return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  }

  function submitReview() {
    captureForm();
    var L = t(), F = S.form;
    if (!F.name.trim()) { F.error = L.needName; return render(); }
    if (!F.rating) { F.error = L.needRating; return render(); }
    if (F.text.trim().length < 3) { F.error = L.needText; return render(); }
    if (!S.db) { F.error = L.offline; return render(); }

    var doc = {
      name: F.name.trim().slice(0, 60),
      city: F.city.trim().slice(0, 40),
      rating: F.rating,
      text: F.text.trim().slice(0, 4000),
      createdAt: new Date().toISOString(),
      lang: S.lang
    };
    var id = newId();
    S.form = { open: false, name: "", city: "", rating: 0, text: "", error: "" };
    render();
    S.db.doc("reviews/" + id).set(doc).then(function () {
      S.open[id] = true;
      toast(L.thanks);
      render();
    }).catch(function (err) {
      S.form.open = true;
      S.form.name = doc.name; S.form.city = doc.city; S.form.rating = doc.rating; S.form.text = doc.text;
      S.form.error = err && err.code === "quota_exceeded" ? "Хранилище заполнено" : L.offline;
      render();
    });
  }

  function submitComment() {
    captureDraft();
    var L = t();
    if (!S.replyTo || !S.db) return;
    if (!S.draft.name.trim() || S.draft.text.trim().length < 2) {
      toast(!S.draft.name.trim() ? L.needName : L.needText);
      return;
    }
    var payload = {
      reviewId: S.replyTo.reviewId,
      parentId: S.replyTo.parentId || "",
      name: S.draft.name.trim().slice(0, 60),
      text: S.draft.text.trim().slice(0, 2000),
      createdAt: new Date().toISOString()
    };
    S.replyTo = null;
    S.draft = { name: payload.name, text: "" };
    render();
    S.db.doc("comments/" + newId()).set(payload).then(function () {
      toast(L.thanksReply);
    }).catch(function () { toast(t().offline); });
  }

  function toggleHide(id) {
    if (!S.db) return;
    var cur = S.moderation[id] && S.moderation[id].hidden;
    S.db.doc("moderation/" + id).set({ hidden: !cur, at: new Date().toISOString() })
      .catch(function () { toast(t().noAccess); });
  }

  function signIn() {
    var L = t();
    var mail = (document.getElementById("l-mail") || {}).value || "";
    var pass = (document.getElementById("l-pass") || {}).value || "";
    if (!mail || !pass) { toast(L.loginHint); return; }
    firebase.auth().signInWithEmailAndPassword(mail.trim(), pass)
      .catch(function () { toast(L.loginFailed); });
  }

  function saveSettings() {
    if (!S.db) return;
    var L = t();
    var st = {
      title: (document.getElementById("a-title") || {}).value || "",
      author: (document.getElementById("a-author") || {}).value || "",
      lede: (document.getElementById("a-lede") || {}).value || ""
    };
    S.settings = st;
    render();
    S.db.doc("settings/site").set(st).then(function () { toast(L.saved); })
      .catch(function () { toast(L.noAccess); });
  }

  /* ===================== старт ===================== */
  render();

  // ---- Firebase ----
  var FIREBASE_CONFIG = {
    apiKey: "ЗАМЕНИТЬ",
    authDomain: "ЗАМЕНИТЬ.firebaseapp.com",
    projectId: "ЗАМЕНИТЬ",
    storageBucket: "ЗАМЕНИТЬ.appspot.com",
    messagingSenderId: "ЗАМЕНИТЬ",
    appId: "ЗАМЕНИТЬ"
  };

  function startFirebase() {
    if (typeof firebase === "undefined" || FIREBASE_CONFIG.apiKey === "ЗАМЕНИТЬ") {
      render();
      return;
    }
    firebase.initializeApp(FIREBASE_CONFIG);
    var db = firebase.firestore();
    S.db = db;

    firebase.auth().onAuthStateChanged(function (user) {
      S.authed = !!user;
      render();
    });

    db.collection("reviews").orderBy("createdAt", "desc").limit(300).onSnapshot(function (snap) {
      S.reviews = snap.docs.map(function (d) {
        var v = d.data() || {};
        return {
          id: d.id, name: v.name || "", city: v.city || "",
          rating: Math.max(1, Math.min(5, parseInt(v.rating, 10) || 5)),
          text: v.text || "", createdAt: v.createdAt || ""
        };
      });
      render();
    }, function () { render(); });

    db.collection("comments").orderBy("createdAt", "asc").limit(1000).onSnapshot(function (snap) {
      S.comments = snap.docs.map(function (d) {
        var v = d.data() || {};
        return {
          id: d.id, reviewId: v.reviewId || "", parentId: v.parentId || "",
          name: v.name || "", text: v.text || "", createdAt: v.createdAt || ""
        };
      });
      render();
    }, function () {});

    db.collection("moderation").limit(500).onSnapshot(function (snap) {
      var m = {};
      snap.docs.forEach(function (d) { m[d.id] = d.data() || {}; });
      S.moderation = m;
      render();
    }, function () {});

    db.doc("settings/site").onSnapshot(function (d) {
      var v = d.exists ? (d.data() || {}) : {};
      S.settings = { title: v.title || DEFAULT_TITLE, author: v.author || "", lede: v.lede || "" };
      render();
    }, function () {});
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startFirebase);
  } else {
    startFirebase();
  }
})();
</script>
</body>
</html>
